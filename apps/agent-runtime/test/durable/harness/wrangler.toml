# Wrangler config for the DURABLE-PORTS harness.
#
# Not a deployable. It exists so `@cloudflare/vitest-pool-workers` can boot the
# REAL `src/worker.ts` — the module the deployed Worker's `main` points at, not
# a bespoke test app — with the bindings the committed `apps/agent-runtime/
# wrangler.toml` does not yet declare, and WITHOUT the dev flag it does.
#
# What this proves that the app's own suite cannot: `resolveDeps` really has a
# durable branch and that branch is really reachable through the deployed
# composition root. Every request in `test/durable/*.spec.ts` goes through
# `SELF`, so it is answered by `src/index.ts`'s app and `src/middleware/auth.ts`
# — nothing is substituted.
#
# THE POINT, stated as an invariant: `FG_DEV_IN_MEMORY_PORTS` is DELIBERATELY
# ABSENT below, and `FG_DEV_API_KEYS` / `FG_DEV_SELF_HOSTED_WORKERS` are
# DELIBERATELY ABSENT too. Under the pre-existing code (`resolveDeps` returning
# `undefined` unless the dev flag was "1") every spec in this directory would
# answer `503 agent_runtime_unavailable`. They pass only because the D1 branch
# exists and is mounted.
#
# The control authority is the cross-script `CONTROL_DATA` object bound below;
# the tenant authority is the `DB` D1 stanza. The exact shapes the deployed
# `apps/agent-runtime/wrangler.toml` carries are written out in `src/ports.ts`
# on `resolveDeps` ("WIRING").

name = "ferrogate-agent-runtime-durable-harness"
main = "../../../src/worker.ts"

# Must match `apps/agent-runtime/wrangler.toml`: at 2025-11-17 the date CARRIES
# `enable_ctx_exports`, and listing the flag as well makes workerd refuse to
# boot. Lowering this date requires adding the flag back in the same edit.
compatibility_date = "2025-11-17"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AGENT_RUN_STATE"
class_name = "AgentRunState"

[[durable_objects.bindings]]
name = "WORKER_PLANE"
class_name = "WorkerPlane"

[[durable_objects.bindings]]
name = "TENANT_DATA"
class_name = "TenantDataObject"

# Zero-D1 S5 (#881): the CONTROL schema is the singleton ControlDataObject, not
# a `[[d1_databases]] CONTROL_DB` stanza. `src/control-data.ts` resolves it off
# `env.CONTROL_DATA`, so this harness binds it cross-script from the gateway aux
# worker (`vitest.config.ts` publishes it under `ferrogate-gateway`), exactly as
# the deployed `apps/agent-runtime/wrangler.toml` binds it cross-script. The DO
# self-migrates the whole control schema on construction, so no migration stanza
# and no `applyD1Migrations` seed it — `setup.ts` writes directly through the
# facade.
[[durable_objects.bindings]]
name = "CONTROL_DATA"
class_name = "ControlDataObject"
script_name = "ferrogate-gateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentRunState", "WorkerPlane", "TenantDataObject"]

# ===========================================================================
# COPY THIS SHAPE INTO apps/agent-runtime/wrangler.toml (integrate step).
#
#   DB          — the TENANT schema. `api_keys` lives here; it is the tenant's
#                 own credential table. Same binding name and schema
#                 `apps/gateway/wrangler.toml` declares, so one key
#                 authenticates identically on both Workers.
# ===========================================================================
[[d1_databases]]
binding = "DB"
database_name = "ferrogate-tenant"
database_id = "agent-runtime-durable-harness-tenant"
migrations_dir = "../../../../../sql/d1-ts/tenant"
# ===========================================================================

[vars]
# NO `FG_DEV_IN_MEMORY_PORTS`. NO `FG_DEV_API_KEYS`. NO
# `FG_DEV_SELF_HOSTED_WORKERS`. See the header — their absence is the gate.

FG_REQUIRE_PRODUCTION_MTLS = "0"
CONTAINER_GOVERNED_EGRESS_HOSTS = ""
AGENT_RUNTIME_ENABLED = "1"
AGENT_JOB_MAX_OPEN_PER_TENANT = "200"
AGENT_JOB_DISPATCH_TTL_SECS = "86400"
FG_DEV_A2A_GUARDRAILS = ""

# The OPERATOR A2A upstream catalog (Rust `config.agent_upstreams`).
#
# INERT IN THIS HARNESS, and deliberately left declared to say so: `CONTROL_DATA`
# is bound above, and with a control object the durable
# `control_plane_resources` documents of kind `agent-upstreams` are the WHOLE
# registry (`src/agents/registry.ts`) — the var is not merged over them, because
# a union would keep dispatching to an id the operator deleted. So every
# upstream `test/durable/agent-upstream-withdrawal.spec.ts` reaches came out of
# D1, and the empty value here cannot be what makes a withdrawal look effective.
#
# THAT CLAIM IS ASSERTED, NOT LEFT AS PROSE. This comment is not a gate — if the
# var half were still consulted, the empty value would keep every positive
# assertion in that spec green while making every NEGATIVE one prove the wrong
# thing. `describe("nothing committed to the harness wrangler.toml reaches this
# suite")` therefore puts a LIVE upstream in the var whose document was never
# written to D1 and requires the dispatch to resolve nothing.
AGENT_UPSTREAMS = "[]"
