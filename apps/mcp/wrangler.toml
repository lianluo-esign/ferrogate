name = "ferrogate-mcp"
main = "src/worker.ts"

# Nothing declared below needs a newer runtime. `nodejs_compat` is what `hono`
# and the WebCrypto code in `src/ports.ts` (`webCryptoIdentityCipher`) expect.
# Raise the date only for a binding that demands it — this Worker uses no
# containers and no `enable_ctx_exports`.
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ===========================================================================
# Bindings for `ferrogate-mcp`
#
# The rule this file follows (same as `apps/gateway/wrangler.toml`): declare
# what the Worker reads or is about to read, and nothing else. An undeclared
# binding the code reads is a production failure no test sees; a declared
# binding nothing will ever read is dead configuration that drifts. Anything
# deliberately WITHHELD is written out at the bottom with the reason.
#
# Values that identify an ACCOUNT RESOURCE (`id`, `database_id`, …) are
# PLACEHOLDERS. `wrangler deploy` will refuse them, which is intentional: the
# real ids come from whoever provisions the resources and are never invented
# and committed here.
# ===========================================================================

# ---------------------------------------------------------------------------
# [vars]
# ---------------------------------------------------------------------------
[vars]

# DEV / TEST ONLY. Installs the in-memory port bundle from `src/ports.ts`
# (including a static API-key table). Production MUST NOT set this: without it
# `resolvePorts` binds `UnboundAuth` and the Worker fails CLOSED — every
# authenticated surface answers `503 mcp_auth_unavailable`, and `GET /readyz`
# answers `503 not_ready` (`portsBound` in `src/ports.ts` is the single source
# of truth both branch on), while `/healthz` still answers 200.
FG_DEV_IN_MEMORY_PORTS = "1"

# DEV / TEST ONLY. JSON `{ keywords?, regex?, secretPatterns?, targets? }`
# configuring the MANAGED-ACTION guardrail (#200/#204) that scans MCP tool
# ARGUMENTS before execution and tool RESULTS after, evaluated by the real
# `@ferrogate/guardrails` deterministic detector — the clean-room port of
# `crates/ferrogate-gateway/src/server/managed_action_guardrail.rs`.
#
# ABSENT OR EMPTY means NO detector is configured, which matches nothing and
# allows everything — the same answer Rust's `match_guardrail` gives when no
# managed-action policy is registered. This is deliberately NOT the enforcement
# policy store: real detector policy is tenant-scoped and lives in the control
# plane, so a `[vars]` entry could only ever be a per-deployment default.
#
# `targets` is Rust's `ManagedActionSelector.targets` over the canonical target
# `mcp:{server}:{tool}`; an empty list selects every target.
FG_DEV_MCP_GUARDRAILS = ""

# Control-plane storage posture. Zero-D1 S5 (#881) backfilled the
# ControlDataObject and cut over: `durable_object` is the default resolvable
# posture, the legacy CONTROL_DB/BILLING_DB fallback is gone. The D1 migration
# re-adds a "d1" posture: set MCP_CONTROL_STORAGE = "d1" to read control rows
# from the real CONTROL_D1 database instead — mcp is a READ-ONLY control
# consumer, so the seam opens a `withSession("first-unconstrained")` replica
# session (colo-local reads, not a cross-region hop to the Tokyo primary).
#
# PORT-TODO(control-plane-d1 §Step2): `src/control-data.ts` reads `env.CONTROL_D1`
# under the "d1" posture, but while MCP_CONTROL_STORAGE stays "durable_object"
# that branch is never taken, so the read is UNREACHABLE in production and the
# binding is deploy-time-only. The live CONTROL_D1 `[[d1_databases]]` stanza
# (binding = "CONTROL_D1", database_name "ferrogate-control") is DEPLOY-TIME
# state carried by wrangler.deploy.toml — a real stanza here would break the
# hermetic vitest/`dev --local` load. env-var-drift parks CONTROL_D1 in
# UNDECLARED_BINDINGS until the posture flips to "d1".
MCP_CONTROL_STORAGE = "durable_object"

# ---------------------------------------------------------------------------
# KV — per-user MCP OAuth flow state
#
# Read as `env.MCP_OAUTH_KV`. This is the durable home of `StoredMcpOauthFlow`
# (`src/ports.ts`), the in-flight authorization records `startMcpOauth` writes
# and `completeMcpOauth` consumes. KV is the right primitive precisely because
# the security property of the ANONYMOUS `GET /v1/mcp/identity/callback` is
# carried by that record: a single-use, TIME-BOUNDED, sha256-keyed `state`.
# KV's native per-key `expirationTtl` enforces the time bound, and `delete()`
# after a successful exchange enforces single use.
#
# WIRING STATE — LIVE. `src/durable.ts`'s `KvOauthFlowStore` reads and writes
# this namespace, and `resolvePorts` binds it whenever `durableIdentityBound`
# holds (D1 + this KV + the identity key). A browser redirected back to a
# DIFFERENT isolate than the one that started the flow now completes.
#
# The ONE property KV cannot give is the atomic single-use claim: Workers KV
# has no compare-and-swap and no conditional write, so `get` + `delete` is not
# the one indivisible operation the Rust store's `UPDATE mcp_oauth_flows SET
# consumed_at = now WHERE consumed_at IS NULL RETURNING *` is. That is why the
# claim now runs through the MCP_OAUTH_FLOWS Durable Object declared below and
# KV is the documented fallback. Pinned by `test/durable-identity.test.ts` and
# `test/oauth-flow-claim.test.ts`.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "MCP_OAUTH_KV"
id = "PLACEHOLDER_SET_AT_DEPLOY_TIME"

# ---------------------------------------------------------------------------
# DURABLE OBJECTS — the atomic single-use claim on an in-flight OAuth flow
#
# Read as `env.MCP_OAUTH_FLOWS`. One instance per sha256(state) digest
# (`idFromName`), so two callbacks racing on the same `state` are serialized
# through one single-threaded actor and the read+delete inside
# `blockConcurrencyWhile` is indivisible. This is what closes the gap KV leaves
# on the ANONYMOUS `GET /v1/mcp/identity/callback`, whose entire authorization
# is that record being single-use and time-bounded.
#
# `class_name` resolves against the ENTRY module, so `McpOauthFlowClaim` is
# re-exported from `src/worker.ts`. Dropping that re-export fails the Worker at
# startup — including under `@cloudflare/vitest-pool-workers`.
#
# DO storage is the per-instance embedded SQLite backend (`new_sqlite_classes`,
# NOT `new_classes`).
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "MCP_OAUTH_FLOWS"
class_name = "McpOauthFlowClaim"

# ---------------------------------------------------------------------------
# DURABLE OBJECTS — the SHARED upstream-MCP session (the `McpManager` port)
#
# Read as `env.MCP_SESSION`. One instance per `(tenant, server)` upstream via
# `idFromName(sessionKey(tenantId, serverName))`, so every isolate serving a
# tenant observes the SAME negotiated protocol revision, tool list and
# connection health instead of re-handshaking per cold isolate and discovering
# an outage once per isolate. That closes
# PORT-TODO(inventory-edge-control §MCP "session manager"), which was never a
# platform limit — the primitive was always here.
#
# The tenant id being part of the DO NAME is the cross-tenant isolation
# property: two tenants configuring an upstream called `search` address two
# different objects by construction, not by a check that can be forgotten.
#
# `class_name` resolves against the ENTRY module, so `FerroGateMcpSession` is
# re-exported from `src/worker.ts`. Dropping that re-export fails the Worker at
# startup, including under `@cloudflare/vitest-pool-workers`.
#
# The binding is OPTIONAL to the code: `HttpMcpUpstreams` takes the store as an
# option and falls back to its per-isolate map when none is supplied, so a
# deployment without this namespace degrades to the previous behaviour rather
# than failing closed on a session lookup.
#
# DO storage is the per-instance embedded SQLite backend (`new_sqlite_classes`).
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "MCP_SESSION"
class_name = "FerroGateMcpSession"

# ---------------------------------------------------------------------------
# DURABLE OBJECTS — the UNIFIED CLIENT session (#687)
#
# Read as `env.MCP_CLIENT_SESSION`. One instance per `(tenant, client session
# id)` via `idFromName(clientSessionKey(tenantId, sessionId))` — the OTHER axis
# from `MCP_SESSION` above, which is one per `(tenant, UPSTREAM)`. Both are
# needed and neither replaces the other: this one holds what ONE CLIENT
# CONVERSATION sees across the whole fan-out (which upstreams it is bound to,
# which of them dropped mid-conversation, and the bounded log of emitted frames
# a `Last-Event-ID` reconnect replays from), and that is #687's "Durable Object
# per session".
#
# The tenant id being half the DO NAME is the cross-tenant isolation property,
# exactly as it is for `MCP_SESSION`: a second tenant presenting the first
# tenant's session id addresses a DIFFERENT object, which was never opened, and
# is refused as unknown. There is no tenant check inside the object for a later
# author to forget.
#
# `class_name` resolves against the ENTRY module, so `FerroGateMcpUnifiedSession`
# is re-exported from `src/worker.ts`. Dropping that re-export fails the Worker
# at startup, including under `@cloudflare/vitest-pool-workers`.
#
# OPTIONAL to the code: without this namespace the ingress mints no session and
# answers exactly as it did before #687 — but it then REFUSES an
# `Mcp-Session-Id` or a `Last-Event-ID` rather than accepting one it cannot
# honour. Offering no sessions is a visible degradation; silently ignoring a
# resume cursor is not.
#
# DO storage is the per-instance embedded SQLite backend (`new_sqlite_classes`).
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "MCP_CLIENT_SESSION"
class_name = "FerroGateMcpUnifiedSession"

# ---------------------------------------------------------------------------
# TENANT_DATA — the gateway-owned SQLite Durable Object that is one tenant's
# database (#822). MCP borrows the namespace by script name so its catalog and
# identity state address the same object the gateway uses; a locally-defined
# class here would silently create a second namespace and split tenant data.
# Deploy order: `ferrogate-gateway` FIRST. A cross-script binding cannot resolve
# until the Worker that owns `TenantDataObject` has been deployed.
# ---------------------------------------------------------------------------
# Its SQLite schema includes `tenant_resources` from tenant migration 0016,
# which is the object-local destination for tenant-private resource kinds.
[[durable_objects.bindings]]
name = "TENANT_DATA"
class_name = "TenantDataObject"
script_name = "ferrogate-gateway"

[[durable_objects.bindings]]
name = "CONTROL_DATA"
class_name = "ControlDataObject"
script_name = "ferrogate-gateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["McpOauthFlowClaim"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FerroGateMcpSession"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["FerroGateMcpUnifiedSession"]

# ---------------------------------------------------------------------------
# Durable Object — per-user MCP identity grants + the upstream server catalog
#
# Read as `env.TENANT_DATA`. The object-local SQLite translation of the Postgres
# tables the Rust `McpCredentialRepository` owns:
#
#   mcp_oauth_credentials  the sealed per-(tenant, workspace, user, server)
#                          grant — refresh/access token ciphertext + nonce +
#                          the bound OIDC `sub`. It MUST outlive the isolate:
#                          a revoked grant that "comes back" on the next
#                          isolate is a security regression, and today it does
#                          exactly that (`InMemoryCredentialStore`).
#   mcp_servers            the tenant's upstream MCP server configs and tool
#                          allowlists (`McpServerConfig`), today reachable only
#                          through `InMemoryUpstreams.register`.
#
# WIRING STATE — LIVE. `sql/d1-ts/tenant/0014_mcp_identity.sql` owns the schema,
# `TenantDataObject` applies it through the object migration ledger,
# `TenantObjectCredentialGrants` implements the grant half, and
# `loadServerCatalog` reads one tenant object. `resolvePorts` binds them; the
# control D1 remains only the control/authentication database.
#
# Two guards worth not losing in a refactor, both pinned by
# `test/durable-identity.test.ts`:
#   * `commit` runs the authorization-generation check INSIDE the INSERT
#     (`INSERT ... SELECT ... WHERE (SELECT generation ...) = ?`), so a
#     revocation landing mid-flow cannot be overwritten by a read-then-write.
#   * `revoke` carries `AND revoked_at_unix IS NULL` in the UPDATE's own WHERE,
#     so a second revoke returns nothing instead of rewriting the timestamp.
# ---------------------------------------------------------------------------
# Zero-D1 S5 (#881): the two CONTROL D1 stanzas that used to sit here —
# `binding = "DB"` and `binding = "BILLING_DB"`, both
# `database_name = "ferrogate-control"` — are deleted. Every control read this
# Worker performs (auth, tenancy lifecycle, admission, the drain document, the
# guardrail policy binding, the billing meter) now resolves through the
# `CONTROL_DATA` DO facade; there is no `d1_compat` binding and no flat
# control D1. Per-tenant data is served from the `TENANT_DATA` Durable Object.

# ---------------------------------------------------------------------------
# R2 — asset object storage
#
# Read as `env.ASSETS`, the production `AssetObjectStore` — the same binding
# name and the same bucket `apps/gateway/wrangler.toml` declares. It holds the
# bytes of every hosted asset, and the MCP `resources/read` / `fetch_asset`
# surfaces fetch the object at `storage_uri` from this bucket.
#
# What breaks without it in the non-dev posture: `resolvePorts` uses
# `InMemoryAssets`, whose contents vanish with the isolate. For assets stored
# only in D1/R2, `resources/list` returns empty, `resources/read` returns
# JSON-RPC `-32602` (`InvalidParams`), and the `fetch_asset` tool returns 404.
#
# WIRING STATE — LIVE. `resolvePorts` selects `D1R2AssetReader` when
# `env.ASSETS`, `env.DB` and `env.TENANT_DATA` are present and
# `FG_DEV_IN_MEMORY_PORTS !== "1"`. It resolves the tenant object's D1 facade
# per request tenant. It uses `InMemoryAssets` when the bucket or route is
# absent, or when `FG_DEV_IN_MEMORY_PORTS === "1"` selects the dev posture.
#
# `bucket_name` / `preview_bucket_name` are PLACEHOLDERS; the deploy step
# substitutes the account's real buckets. R2 names are lowercase alphanumerics
# and hyphens, 3–63 chars.
#
# NOTE: R2 is active on the live `ferrogate` account as of 2026-07-31
# (monthly subscription). `bucket_name` / `preview_bucket_name` remain
# deploy-time placeholders and must be replaced with the account's real buckets.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "replace-at-deploy-ferrogate-assets"
preview_bucket_name = "replace-at-deploy-ferrogate-assets-preview"

# ===========================================================================
# NOT DECLARED — and why
#
# * SECRETS STORE — `FERROGATE_MCP_IDENTITY_KEY`, the 32-byte AEAD key
#   `webCryptoIdentityCipher` seals stored grants under, and the OAuth client
#   secrets `SecretResolverPort.resolve` dereferences. Secret VALUES never
#   belong in this file, so there is nothing to declare here; the name is read
#   off `env` and seeded per environment with `wrangler secret put` (or a
#   Secrets Store binding of the same name — identical from the code's side).
#
#   The consuming half IS implemented: `decodeIdentityKey` in `src/durable.ts`
#   accepts base64 or hex, REFUSES anything that is not exactly 32 bytes, and
#   `identityCipherFrom` returns undefined on refusal so `durableIdentityBound`
#   is false and `/readyz` answers 503 — instead of the Worker quietly sealing
#   grants under the ephemeral per-isolate key that only the dev bundle should
#   ever use.
#
#   // PORT-TODO(inventory-edge-control §MCP): what remains is a platform
#   // constraint, not missing code — CF bindings (Secrets Store included)
#   // resolve at DEPLOY time. There is no runtime "open secret by name/uuid"
#   // API, so this Worker cannot fetch its own key, cannot hold two key
#   // versions at once, and cannot rotate without a redeploy. That is why
#   // `StoredMcpOauthCredential.keyVersion` is carried but never used to select
#   // a key here: honest field, no runtime resolver to feed it.
#
# * ANALYTICS ENGINE. `InMemoryAuditSink` keeps the `tool.execute` /
#   `mcp.identity.*` rows — including the `agent_run_id` correlation column
#   (#522) — only for the life of the isolate, so audit evidence does not
#   survive eviction. The durable sink is `apps/telemetry`, reached by a
#   service binding or an Analytics Engine dataset.
#   PORT-TODO(inventory-edge-control §MCP "audit"): NOT a platform limit — CF
#   has the primitive (Analytics Engine is binding-only, which is exactly what
#   a Worker can use). It is a cross-app deferral on `apps/telemetry`.
#   CONSEQUENCE while it stands: the `agent_run_id` correlation rows this
#   Worker threads correctly (#522, pinned by `test/agent-run-id.test.ts`) are
#   still WRITTEN to an isolate-local sink, so the threading is proven but the
#   evidence is not yet durable.
#
# * SERVICE BINDINGS. `[[services]]` names another deployed Worker; an
#   unimplemented target turns every call into a runtime error instead of a
#   clean 503, so the gateway / control-plane hops stay `fetch()` for now.
# ===========================================================================

# ===========================================================================
# DURABLE OBJECTS — the SHARED admission counter (wave 16 finding D1; #666)
#
# LIVE. It was committed COMMENTED OUT from wave 16 until issue #666, with
# "UNCOMMENT AT DEPLOY TIME" written above it, which meant the committed tree
# was the BROKEN configuration: a credential capped at 60 rpm was charged 60
# here, 60 more on `apps/gateway` and 60 more per `apps/agent-runtime` isolate,
# and nothing errored when a deploy forgot the two lines. See the harness note
# at the bottom for why it can now be live.
#
# Read as `env.RATE_LIMIT` by `src/admission/counters.ts::limiterForEnv`. This
# is NOT a class this script defines: `script_name` names `apps/gateway`'s
# already-deployed `RateLimiterDurableObject`, so `idFromName("key:<id>")` here
# addresses the SAME instance the gateway addresses. That sharing IS the fix —
# a credential at 60 rpm is charged ONE window across `/v1/chat/completions`,
# `/v1/mcp` and `/v1/mcp/tool/execute`. A private class here would compile,
# deploy, pass every test, and hand this Worker its own full quota: a quieter
# version of the admission bypass wave 16 closed.
#
# NO lifecycle declaration belongs to it. The class is introduced by the script
# that DEFINES it — `apps/gateway`, whose `[exports.RateLimiterDurableObject]`
# SQLite declaration already exists. A second lifecycle declaration here would
# claim to define a class this script does not
# export and `wrangler deploy` rejects it. For the same reason there is no
# `src/worker.ts` re-export: this Worker BINDS the class, it does not define
# it. (If the class is ever MOVED into this app, the stanza must be
# an SQLite `exports` declaration, never a legacy key-value declaration.)
#
# DEPLOY ORDER: `ferrogate-gateway` FIRST. A `script_name` binding to a script
# that does not exist yet FAILS THE DEPLOY — which is the point. That refusal
# is the deploy-time assertion the old comment could never be.
# ===========================================================================
[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimiterDurableObject"
script_name = "ferrogate-gateway"

# ---------------------------------------------------------------------------
# HOW THE OFFLINE HARNESS RESOLVES THE LINE ABOVE
#
# The measured reason this stanza was commented (2026-08-01) was real: a bare
# `@cloudflare/vitest-pool-workers` session refuses to start with
#
#   Worker "core:user:vitest-pool-workers-runner-"'s binding "RATE_LIMIT"
#   refers to a service "core:user:ferrogate-gateway", but no such service is
#   defined.
#
# and the whole MCP suite went to 0 tests / 23 collection errors. The reading
# that was WRONG is "workerd cannot resolve a cross-script binding offline".
# workerd cannot resolve it against a script that is not in the SESSION —
# `vitest.config.ts` now puts one there, an auxiliary worker named
# `ferrogate-gateway` carrying the gateway's real `RateLimiterDurableObject`
# (`apps/gateway/test/support/rate-limit-aux-worker.ts`). So the binding is
# live, the suite is green, and `test/shared-rate-limit.test.ts` charges a
# window as the gateway and requires THIS Worker to find it spent.
#
# `wrangler dev --local` on this app alone boots too (wrangler >=4.114 reports
# the binding as `[not connected]` rather than refusing), so `e2e/` and the
# boot proof are unaffected. To exercise the counter locally, put the gateway
# in the same dev session:
#
#   bunx wrangler dev --local -c wrangler.toml -c ../gateway/wrangler.toml
# ---------------------------------------------------------------------------
# --- Workers Observability ---------------------------------------------------
# Owner directive (2026-08-02): enable Workers Observability on the whole fleet
# so production behaviour can be read back from the CLI (`wrangler tail`) and the
# Workers Logs query API, instead of being inferred from responses.
#
# THREE INDEPENDENT SWITCHES, exactly as `apps/telemetry/wrangler.toml` documents:
# `enabled` alone does NOT turn on tracing — the traces sub-table is its own
# opt-in, and omitting it leaves this Worker's spans unrecorded.
#
# `invocation_logs` is ON here, unlike the telemetry ingest Worker: the automatic
# one-per-request event is what makes a request greppable at all when debugging,
# which is the whole point of the directive. It roughly DOUBLES billable log
# events, so lower `head_sampling_rate` on a high-QPS deployment rather than
# turning this back off — a sampled invocation log still lets you find a request,
# a missing one does not.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
