# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-06-11
# description: Token4AI Cloud, FerroGate AI Gateway, Rust API Gateway, agent-native AI traffic infrastructure.

[workspace]
members = [
    "crates/ferrogate-admin",
    "crates/agent-worker",
    "crates/ferrogate-auth",
    "crates/ferrogate-billing",
    "crates/ferrogate-cli",
    "crates/ferrogate-config",
    "crates/ferrogate-core",
    "crates/ferrogate-guardrails",
    "crates/ferrogate-mcp",
    "crates/ferrogate-observability",
    "crates/ferrogate-policy",
    "crates/ferrogate-providers",
    "crates/ferrogate-routing",
    "crates/ferrogate-runtime",
    "crates/ferrogate-secrets",
    "crates/ferrogate-storage",
    "tools/ferrogate-test",
]
default-members = ["crates/ferrogate-cli"]
resolver = "2"

[workspace.package]
version = "2026.7.9"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/lianluo-esign/ferrogate"
homepage = "https://lianluo-esign.github.io/ferrogate/"
authors = ["jamesduan <https://x.com/JamesDuanL>"]

[workspace.metadata.token4ai]
cloud = "https://token4ai.cloud"
company = "Commercial cloud service company represented by Token4AI Cloud"
author = "jamesduan"
author_x = "https://x.com/JamesDuanL"
created = "2026-06-11"
attribution = "Token4AI Cloud, FerroGate AI Gateway, Rust API Gateway, agent-native AI traffic infrastructure"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22.1"
blake2 = "0.10"
bytes = "1.7"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
deadpool-postgres = "0.14.1"
futures-util = "0.3"
hmac = "0.12"
http = "1"
# JSON Schema is a standard with references, combinators, numeric semantics,
# and draft compatibility. Reimplementing a partial validator would silently
# accept policies that operators expect a conforming validator to reject.
jsonschema = { version = "0.47", default-features = false }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "rcgen", "ring"] }
jsonwebtoken = "9"
matchit = "0.8"
# Pingora 0.8.1 still ships prometheus 0.13/protobuf 2.x. Keep the runtime on
# the audited 0.8.0 source while the path patch below applies the upstream
# prometheus 0.14 dependency fix without pulling unreleased Pingora code.
pingora = { version = "=0.8.0", features = ["proxy", "rustls"] }
redis = "0.25"
native-tls = "0.2"
postgres = "0.19"
postgres-native-tls = "0.5"
rcgen = "0.14.7"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
rmcp = { version = "1.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process", "transport-io", "macros"] }
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.10"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7.18"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
proptest = "1"

[patch.crates-io]
# Remove after Pingora publishes a release whose pingora-core depends on
# prometheus 0.14+ (https://github.com/cloudflare/pingora/issues/875).
pingora-core = { path = "vendor/pingora-core-0.8.0" }
