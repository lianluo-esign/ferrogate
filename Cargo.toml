[package]
name = "ferrogate"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Open-source Rust AI gateway and reverse proxy for routing, securing, and observing AI traffic."
license = "Apache-2.0"
repository = "https://github.com/lianluo-esign/ferrogate"
homepage = "https://token4ai.cloud/ferrogate"
readme = "README.md"
keywords = ["ai", "gateway", "llm", "proxy", "rust"]
categories = ["web-programming::http-server", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
http = "1"
pingora = { version = "0.8", features = ["proxy", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.10"
