# The nginx entrypoint hook `render-env-config.sh` replaces this file with the
# same-origin proxy configuration for the configured control-plane and gateway
# upstreams before nginx starts. This checked-in version remains a safe local
# static fallback for image inspection and serves the SPA shell only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # env-config.js is regenerated per-container-start; never let a CDN or
    # browser cache a stale backend URL.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    # react-router uses BrowserRouter, so every non-asset path must fall
    # back to index.html for client-side routing to take over.
    location / {
        try_files $uri /index.html;
    }
}
