# Created: 2026-07-24
# description: Wrangler config for the FerroGate d1-proxy Worker (issue #450): a NATIVE D1
#   binding (env.DB) fronted by a bearer-authenticated HTTP API for the atomic control-plane
#   hot path (batch/RETURNING) the D1 REST query API cannot serve.

name = "ferrogate-d1-proxy"
main = "src/index.ts"

# A recent runtime for the D1 binding API (prepare/bind/batch/RETURNING).
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# --- D1 binding -------------------------------------------------------------
# `env.DB` is the native D1 handle this Worker runs prepare()/bind()/batch()
# against. Point it at the FerroGate CONTROL database: the atomic families this
# proxy serves (billing metering + report outbox in this slice) are all
# account-global control-plane data, routed to the control database exactly like
# the landed REST families (docs/cloudflare-d1-backend.md).
#
# The gate fills `database_id` (and `database_name`) LIVE at deploy time from the
# provisioned control database's uuid — the same uuid seeded into
# `storage.d1_control_database_id`. Left as a placeholder here (deploy config
# only; the gate binds live):
[[d1_databases]]
binding = "DB"
database_name = "ferrogate-control"
database_id = "REPLACE_WITH_CONTROL_DATABASE_UUID"

# --- Per-tenant D1 bindings (issue #455) ------------------------------------
# The database-per-tenant topology keeps a tenant's financial state (wallets +
# reservations) in that tenant's OWN D1 database. The Workers runtime can reach
# a D1 database ONLY through a statically-declared binding (there is no runtime
# "open database by id" API), so each tenant database is bound below under a
# name the Rust side derives from the tenant id: `TENANT_DB_<TENANT_ID>`, with
# `-` folded to `_` and uppercased (see `tenant_database_binding` in
# crates/ferrogate-storage/.../control_plane_store_d1/mod.rs). A tenant-scoped
# request sets `{ "database": "TENANT_DB_ACME", ... }`; the Worker resolves
# env["TENANT_DB_ACME"]. Omitting `database` (or "DB") targets the control DB.
#
# ONBOARDING A TENANT therefore requires adding its binding here + redeploying
# (`wrangler deploy`) — the same per-binding, redeploy-to-onboard model the #423
# Secrets-Store bindings use. The gate fills `database_id` LIVE from the uuid the
# provisioner recorded in the tenant->database registry. Example (commented; the
# gate uncomments + fills one block per provisioned tenant):
#
# [[d1_databases]]
# binding = "TENANT_DB_ACME"
# database_name = "ferrogate-tenant-acme"
# database_id = "REPLACE_WITH_TENANT_ACME_DATABASE_UUID"

# --- Observability ----------------------------------------------------------
[observability]
enabled = true

# --- Secrets (NOT stored here) ----------------------------------------------
# D1_PROXY_TOKEN is the DIY bearer credential the Worker checks on every /d1/*
# route. Seed it out-of-band:
#   wrangler secret put D1_PROXY_TOKEN
# FerroGate's Rust side resolves the SAME secret through the #405/#417 seam and
# presents it as the Bearer token on the proxy client's requests.
