# description: Wrangler config for the FerroGate gateway-front Worker (issue #470):
#   the veto-only shell in front of the container-hosted Pingora data plane.

name = "ferrogate-gateway-front"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
# Mirrors the origin's `limits.inference_body_max_bytes`. The shell may reject a
# body over this cap because the cap is a deployment constant, not a policy.
INFERENCE_BODY_MAX_BYTES = "1048576"

# Operator-managed revocations, newline-separated SHA-256 hex digests of the
# presented bearer secret. This is the ONLY state the shell consults, and it can
# only turn an origin ALLOW into a Worker DENY -- see
# docs/cloudflare-data-plane-decision.md §6.
EDGE_DENY_LIST = ""

# `/__conformance/decide` is 404 unless this is exactly "1". It must never be
# set in a production deployment: the route exists so the governed-decision
# corpus can drive the same shell code the request path uses.
# CONFORMANCE = "1"
