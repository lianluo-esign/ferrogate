# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-07-23
# description: Wrangler config for the FerroGate agent-gateway Worker (issue #413):
#   Durable Object agent class binding + SQLite-backed DO migration.

name = "ferrogate-agent-gateway"
main = "src/index.ts"

# Pin the compatibility date; the Agents SDK + DO RPC require a recent runtime.
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# --- Durable Object binding -------------------------------------------------
# The gateway hosts one agent Durable Object class. `getAgentByName(env.AGENT_GATEWAY, name)`
# and `routeAgentRequest` resolve instances through this binding.
[[durable_objects.bindings]]
name = "AGENT_GATEWAY"
class_name = "AgentGateway"

# --- Durable Object migration ----------------------------------------------
# The Agents SDK stores agent state in a per-instance embedded SQLite database,
# so the class MUST be registered with `new_sqlite_classes` (NOT `new_classes`).
#
# SDK CAVEAT (verify against the pinned `agents` version at deploy time):
#   * Recent wrangler (4.x) accepts this `[[migrations]]` array form with
#     `new_sqlite_classes`.
#   * Some Agents SDK templates instead surface DO classes through the newer
#     top-level `exports`/`[migrations]` mechanism. If `wrangler deploy` reports
#     an unknown-migration-key or a "class not exported" error, switch this block
#     to the form the pinned SDK documents (see README "SDK migration caveat").
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentGateway"]

# --- Memory layers (issue #427) ---------------------------------------------
# Governed memory routes (/memory/*) over the agent's per-instance layers:
# synced state, embedded SQLite, chat history. See docs/cloudflare-agent-memory.md.
[vars]
# Semantic-memory pilot (Vectorize + Workers AI) — OPEN BETA, default OFF.
# Flip to "true" AND uncomment the VECTORIZE/AI bindings below to pilot.
MEMORY_SEMANTIC_ENABLED = "false"
# Chat-history retention cap enforced by /memory/chat/prune (the pinned Agents
# SDK 0.0.109 predates the SDK-side maxPersistedMessages option).
MEMORY_MAX_PERSISTED_MESSAGES = "200"
# --- Scheduling (issue #426) -------------------------------------------------
# Governed /schedule/* routes over the agent's in-DO SQLite scheduler
# (cf_agents_schedules rows, single-alarm multiplexed; survive hibernation).
# Per-instance cap on concurrent schedule rows (alarm-row hygiene).
SCHEDULE_MAX_TASKS_PER_INSTANCE = "100"
# --- Container / Sandbox isolation (issue #415) ------------------------------
# Governed /container/* routes over a per-tenant Cloudflare Container or
# @cloudflare/sandbox instance ("just another sandbox"; egress deny-by-default).
# See docs/cloudflare-container-isolation.md. Cap on captured stdout/stderr bytes.
CONTAINER_MAX_OUTPUT_BYTES = "1000000"
# --- Governed egress allowlist (issue #471) ----------------------------------
# The ONLY hosts /container/start may open egress to — in practice the FerroGate
# gateway host, and nothing else. Comma-separated, bare hostnames.
#
# EMPTY MEANS SEALED: with no authorized host, every container starts with NO
# egress at all and any egressAllowlist request is rejected 422. That is the
# intended default — a forgotten configuration must fail closed. Set it to the
# tenant's gateway hostname when the governed data plane (#470) is deployed.
CONTAINER_GOVERNED_EGRESS_HOSTS = ""

# Container/sandbox binding (Workers PAID only). Enabled 2026-07-24 by the
# test gate for #415 live validation: `AgentSandbox` re-exports
# `@cloudflare/sandbox`'s Sandbox class (see src/index.ts), backed by the
# prebuilt public image — no local Docker build required.
[[durable_objects.bindings]]
name = "CONTAINER_SANDBOX"
class_name = "AgentSandbox"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AgentSandbox"]

[[containers]]
name = "ferrogate-agent-sandbox"
class_name = "AgentSandbox"
image = "docker.io/cloudflare/sandbox:0.12.4"
instance_type = "dev"   # wrangler 4.20 vocabulary: dev | basic | standard

# Semantic pilot bindings (leave commented out while the pilot is off):
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "ferrogate-agent-memory"
#
# [ai]
# binding = "AI"

# --- Observability ----------------------------------------------------------
[observability]
enabled = true

# --- Secrets (NOT stored here) ----------------------------------------------
# GATEWAY_CONTROL_TOKEN is the DIY bearer credential the Worker checks in
# onBeforeRequest / onRequest / the control routes. Seed it out-of-band:
#   wrangler secret put GATEWAY_CONTROL_TOKEN
# FerroGate's Rust deploy pipeline seeds it from the #405/#417 secret seam.
#
# --- Brokered git credentials (issue #475) ----------------------------------
# /git-credential/* mints repo-scoped GitHub App installation tokens per git
# operation, so nothing GitHub-shaped rests inside the container. Two inputs:
#
#   GITHUB_APP_ID          — a plain var (not a secret). Uncomment + set below.
#   GITHUB_APP_PRIVATE_KEY — the App key, PKCS#8 PEM. Seed out-of-band:
#       openssl pkcs8 -topk8 -nocrypt -in app.private-key.pem -out app.pkcs8.pem
#       wrangler secret put GITHUB_APP_PRIVATE_KEY < app.pkcs8.pem
#
# Why a Worker secret and NOT a Secrets Store binding: an RSA App key PEM is
# ~1.7 KB and the Secrets Store beta caps a secret VALUE at 1024 bytes, so the
# key does not fit. Worker secrets are capped at 5 KB, so it does. If a future
# GA cap lifts that ceiling, add the binding below and the route prefers it:
#
# [[secrets_store_secrets]]
# binding = "GITHUB_APP_PRIVATE_KEY_STORE"
# store_id = "<STORE_ID>"
# secret_name = "github-app-private-key"
#
# NOTE the shape: `store_id` + `secret_name`, both fixed at DEPLOY time, and
# the runtime read is `await env.BINDING.get()` with NO name argument. A Worker
# cannot bind a store and look a secret up by name, which is why per-USER
# credentials can never be read this way — see
# docs/cloudflare-git-credential-broker.md.
#
# [vars]
# GITHUB_APP_ID = "<APP_ID>"
# GITHUB_API_BASE_URL = "https://api.github.com"
