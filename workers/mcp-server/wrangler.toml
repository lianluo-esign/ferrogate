# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-07-23
# description: Wrangler config for the FerroGate-hosted MCP server Worker (issue #409):
#   McpAgent Durable Object mounted at /mcp + OAUTH_KV binding + SQLite-backed DO migration.

name = "ferrogate-mcp-server"
main = "src/index.ts"

# Pin the compatibility date; the Agents SDK + McpAgent DO require a recent runtime.
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# --- Durable Object binding -------------------------------------------------
# The MCP server is an Agents SDK `McpAgent` Durable Object. Each MCP session is
# a stateful, per-session instance resolved through this binding. `McpAgent.serve`
# / `serveSSE` route `/mcp` + `/sse` to instances of this class.
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "FerroGateMcp"

# --- Durable Object migration ----------------------------------------------
# The Agents SDK stores session state in a per-instance embedded SQLite database,
# so the class MUST be registered with `new_sqlite_classes` (NOT `new_classes`).
#
# SDK CAVEAT (verify against the pinned `agents` version at deploy time): recent
# wrangler (4.x) accepts this `[[migrations]]` array form with `new_sqlite_classes`.
# If `wrangler deploy` reports an unknown-migration-key or "class not exported"
# error, switch to the form the pinned SDK documents (see README).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FerroGateMcp"]

# --- KV binding for the OAuth provider -------------------------------------
# `@cloudflare/workers-oauth-provider` persists issued grants / tokens / clients
# in KV. Create the namespace once and paste its id here:
#   wrangler kv namespace create OAUTH_KV
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_OAUTH_KV_NAMESPACE_ID"

# --- Observability ----------------------------------------------------------
[observability]
enabled = true

# --- Secrets (values NEVER stored here) -------------------------------------
# The automation bearer bypasses the interactive OAuth flow. It is OPTIONAL —
# without it, OAuth is the only way in. The Worker checks two sources in order:
# the Secrets Store binding first, the plain secret second.
#
# WHICH PATH TO USE depends on how this Worker gets deployed, and getting it
# wrong loses the credential silently:
#
# 1. PREFERRED where FerroGate's Rust pipeline deploys the Worker — declare the
#    binding THERE, with
#    `McpWorkerSpec::with_bearer_token_from_secrets_store(<STORE_ID>)`.
#
#    A Workers Script-API PUT replaces the script's ENTIRE binding set, and the
#    upload's `keep_bindings` covers only `secret_text` — NOT
#    `secrets_store_secret` (see `DEFAULT_KEEP_BINDINGS` in
#    crates/ferrogate-mcp/src/mcp_worker_deploy.rs for why it is not listed).
#    So a `[[secrets_store_secrets]]` block declared ONLY here is erased by the
#    next Rust-side deploy: `env.MCP_BEARER_TOKEN_STORE` becomes undefined and
#    the automation path degrades to OAuth-only with NO error and NO log line.
#
# 2. Use the `[[secrets_store_secrets]]` block below only when `wrangler deploy`
#    is how this Worker reaches Cloudflare — or alongside (1), declaring the same
#    store id on both sides so either deploy path reproduces the binding.
#
#    Create the store + secret once, then uncomment and paste the store id:
#
#      wrangler secrets-store store create ferrogate
#      wrangler secrets-store secret create <STORE_ID> --name mcp-bearer-token
#
#    Kept commented because it is optional and a store id that does not exist
#    fails the deploy outright.
#
#    The secret NAME is canonical (`[a-z0-9-]+`) on purpose: it is what makes the
#    same secret ALSO addressable from the Rust gateway as
#    `cf://ferrogate/mcp-bearer-token`. Canonical naming is NECESSARY but not
#    SUFFICIENT — Secrets Store values are write-only over REST, so resolving
#    that reference additionally requires the value to reach the gateway process
#    (`FERROGATE_CF_SECRET_MCP_BEARER_TOKEN`, or an injected `CfSecretBindings`).
#    See docs/cloudflare-secrets-resolution.md (#423).
#
#    NOTE the runtime read is `await env.MCP_BEARER_TOKEN_STORE.get()` with NO
#    name argument: store id + secret name are fixed at DEPLOY time. It costs one
#    store read per request that presents a `Bearer` credential.
#
# [[secrets_store_secrets]]
# binding = "MCP_BEARER_TOKEN_STORE"
# store_id = "REPLACE_WITH_SECRETS_STORE_ID"
# secret_name = "mcp-bearer-token"
#
# 3. FALLBACK — a plain Worker secret, for deployments with no Secrets Store:
#      wrangler secret put MCP_BEARER_TOKEN
#
#    Unlike (2), this one DOES survive a redeploy through the Rust pipeline: the
#    upload metadata carries `keep_bindings: ["secret_text"]`
#    (`McpWorkerSpec::keep_bindings`), which tells Cloudflare to preserve it.
