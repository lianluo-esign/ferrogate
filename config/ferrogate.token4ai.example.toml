# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
#
# Example FerroGate gateway config for the token4ai.cloud upstream serving
# gpt-5.5, with the standalone billing service wired in over REST (issues
# #129/#131/#133). Launch the services from the single `ferrogate` binary:
#
#   FERROGATE_BILLING_LISTEN=127.0.0.1:8092 ferrogate billing serve
#   TOKEN4AI_API_KEY=sk-... ferrogate gateway --config config/ferrogate.token4ai.example.toml
#
# Then call the gateway:
#   curl -s http://127.0.0.1:8080/v1/chat/completions \
#     -H 'authorization: Bearer client-secret' -H 'content-type: application/json' \
#     -d '{"model":"gpt-5.5","messages":[{"role":"user","content":"hello"}]}'
#
# The gateway reports settled usage to `ferrogate billing serve`, which prices
# it against its rate card and records a ledger entry:
#   curl -s http://127.0.0.1:8092/v1/billing/ledger

listen = "127.0.0.1:8080"

[cluster]
enabled = true
cluster_id = "ferrogate-token4ai"
node_id = "node-a"
state_backend = "local"
counter_backend = "local"

[reliability]
# gpt-5.x reasoning models can take longer than the default dispatch budget.
provider_dispatch_timeout_secs = 120
provider_dispatch_max_retries = 0

# The gateway reports each settled usage event to the standalone billing
# service over REST (fire-and-forget; never blocks the request hot path).
[billing_service]
enabled = true
endpoint = "http://127.0.0.1:8092"
timeout_millis = 5000

# ---------------------------------------------------------------------------
# Upstreams. token4ai.cloud is OpenAI-compatible, so `kind = "openai"` serves
# gpt-5.5 and every other gpt-5.x model with no adapter changes. The other
# vendors below show how to add Anthropic/Gemini/Grok/DeepSeek upstreams; each
# api key is read from the named environment variable, never stored in config.
# ---------------------------------------------------------------------------
[[providers]]
name = "token4ai"
kind = "openai"
base_url = "https://api.token4ai.cloud/v1"
api_key_env = "TOKEN4AI_API_KEY"

# [[providers]]
