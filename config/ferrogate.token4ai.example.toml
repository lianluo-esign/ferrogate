#
# [[providers]]
# name = "grok"
# kind = "grok"
# base_url = "https://api.x.ai/v1"
# api_key_env = "XAI_API_KEY"
#
# [[providers]]
# name = "deepseek"
# kind = "openai"
# base_url = "https://api.deepseek.com/v1"
# api_key_env = "DEEPSEEK_API_KEY"

# Closed physical-route vocabulary: chat, streaming, vision, images,
# embeddings, tools, structured_output. Unknown names fail configuration
# loading; each fallback/canary declares its own capabilities and context.
[[models]]
name = "gpt-5.5"
provider = "token4ai"
provider_model = "gpt-5.5"
capabilities = ["chat", "streaming"]
input_price_per_1m = 5.0
output_price_per_1m = 15.0

[[models]]
name = "gpt-5"
provider = "token4ai"
provider_model = "gpt-5"
capabilities = ["chat", "streaming"]
input_price_per_1m = 5.0
output_price_per_1m = 15.0

