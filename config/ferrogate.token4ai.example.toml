#
# [[models]]
# name = "deepseek-chat"
# provider = "deepseek"
# provider_model = "deepseek-chat"
# capabilities = ["chat", "streaming"]

[[api_keys]]
id = "client"
name = "Client"
key = "client-secret"
scopes = ["models.read", "chat.completions", "responses.create"]
allowed_models = ["gpt-5.5", "gpt-5"]
organization_id = "org_demo"
project_id = "project_gateway"

[[api_keys]]
id = "admin"
name = "Admin"
key = "admin-secret"
scopes = ["admin.read", "admin.write"]
# Issue #540: administers every tenant, so it declares it. The client key above
# names its tenant instead; a key that does neither no longer loads.
platform_operator = true
