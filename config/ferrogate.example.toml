# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-06-11
# description: Token4AI Cloud, FerroGate AI Gateway, Rust API Gateway, agent-native AI traffic infrastructure.

# FerroGate example configuration

listen = "127.0.0.1:8080"

[telemetry]
service_name = "ferrogate"
log_bodies = false
access_log = "error"
access_log_sample_rate = 100
access_log_error_rate_limit_per_sec = 100

# Telemetry export destination. `provider` selects the backend; the wire
# protocol is OTLP/HTTP+JSON in every case.
#
#   vector     -- self-hosted collector (default)
#   otlp       -- any OTLP/HTTP collector, no credential
#   cloudflare -- the FerroGate telemetry-collector Worker, which fans out to
#                 Analytics Engine + Workers Logs (issue #520). Cloudflare has
#                 no telemetry ingest endpoint of its own, so that Worker --
#                 deployed from workers/telemetry-collector/ -- IS the endpoint.
#   none       -- disabled
#
# [observability]
# enabled = true
# provider = "cloudflare"
# otlp_endpoint = "https://ferrogate-telemetry-collector.<subdomain>.workers.dev"
# # Secret reference, never the token itself. Resolved through the shared
# # SecretResolverRegistry, so `cf://` (Cloudflare Secrets Store) works too.
# cloudflare_collector_token_ref = "env://FERROGATE_CF_COLLECTOR_TOKEN"
# # Fallback tenant for records with no tenant attribute: Analytics Engine
# # allows exactly one index per data point and the collector uses the tenant
# # as that index, so it needs some value.
# cloudflare_default_tenant = "default"

[metering]
export_enabled = false
export_endpoint = "https://api.token4ai.cloud/v1/metering/events"
# export_token_env = "FERROGATE_METERING_TOKEN"
# export_timeout_secs = 3

# Tenant-identity semantics (issues #515, #540). `organization_id` on an API
# key is a foreign key to `tenants.id` AND the authorization identity every
# tenant-isolation check reads -- so the answers below decide how much a
# credential can reach, and both used to be implicit.
#
# There is nothing to switch on here any more. Since #540 every [[api_keys]]
# entry must say which it is:
#
#   platform_operator = true      # administers EVERY tenant
#   organization_id = "<id>"      # belongs to exactly one tenant
#
# A key that says neither is refused when the config loads -- by id, with both
# fixes printed -- rather than being promoted to platform root the way an
# omitted field used to be. `ferrogate check` refuses it too, so you find out
# before the restart. Credentials the config cannot enumerate (virtual keys,
# the external auth service) are refused at authentication instead, with
# `tenant_identity_required`.
[tenancy]
# Restores the pre-#515 behaviour while you annotate an existing deployment:
# every key that declares neither identity is admitted as an UNRESTRICTED
# platform operator that can read and mutate every tenant, and the gateway logs
# each one by id at startup. Annotate the keys, then delete this line -- do not
# leave it on. Uncomment only if an upgrade stopped a running gateway and you
# need it back up in one edit.
# implicit_platform_operator = true
# When `true`, `POST`/`PUT /admin/v1/api-keys` refuses an `organization_id`
# that names no `tenants` row (400) instead of storing the dangling reference
# and reporting it in the log/audit trail. Off by default because a misspelled
# tenant cannot REACH another tenant -- the key is scoped to an island of its
# own -- and whether a tenant exists is a fact about the control-plane store,
# not the config, so there is no load-time check that could warn you first.
# That is narrower than "harmless": such a key still serves traffic, and an id
# that names no row is skipped by the lifecycle chain, so it also escapes
# tenant suspension and every tenant-scoped quota policy. Turn it on once every
# tenant your keys reference is registered through /admin/v1/tenant-accounts.
require_registered_tenant = false

# Authentication posture (issue #542). Authentication is REQUIRED by default:
# every request must present a credential, which is resolved against the
# external auth service, the durable/virtual key store, and [[api_keys]] -- in
# that order. There is nothing to switch on here.
#
# Before #542 this was inferred from `auth_service.enabled ||
# !api_keys.is_empty()`, which counted STATIC config keys only: a deployment
# whose credentials were all virtual keys, minted through
# POST /admin/v1/virtual-keys, had authentication switched OFF by an empty
# [[api_keys]] section, and every request was admitted with no credential at
# all as an unrestricted platform operator.
#
# Uncomment to run an OPEN gateway -- every request admitted as a platform
# operator, no credential required. Appropriate for a laptop, a demo, or a
# gateway used purely as an L7 reverse proxy on a trusted network. A config
# with no credential source (no [[api_keys]], no enabled [auth_service], no
# durable [storage] backend -- postgres, supabase or cloudflare_d1 -- to hold
# virtual keys) refuses to start without it, rather than running open by
# default. `ferrogate check` refuses it too, so you find out before the
# restart. In a Caddyfile the same statement is `auth off` in the global
# options block.
#
# Leaving this on next to a durable [storage] backend is allowed but warned
# about at startup: every virtual key in that control plane is ignored and
# every caller is admitted as an unrestricted platform operator.
# [auth]
# disabled = true

[storage]
request_log_retention_records = 10000
audit_event_retention_records = 10000
billing_event_retention_records = 10000
admin_list_default_limit = 100
admin_list_max_limit = 1000

[cache]
enabled = false
mode = "exact_match"
ttl_secs = 300
max_records = 1000

[tls]
enabled = false
# cert_path = "./certs/fullchain.pem"
# key_path = "./certs/privkey.pem"
http2 = false

# Use this instead of cert_path/key_path when FerroGate should request a
# Let's Encrypt-compatible certificate during startup through DNS-01 hooks.
# [tls.acme]
# enabled = true
# domains = ["api.example.com"]
# email = "ops@example.com"
# directory_url = "https://acme-v02.api.letsencrypt.org/directory"
# terms_agreed = true
# storage_dir = "./acme"
# dns_provider = "cloudflare"
# dns_config = { api_token = "cf-token", zone_id = "zone-123" }
# dns_propagation_delay_secs = 30

# HTTP-01 alternative for non-wildcard domains:
# [tls.acme]
# enabled = true
# domains = ["api.example.com"]
# email = "ops@example.com"
# directory_url = "https://acme-v02.api.letsencrypt.org/directory"
# terms_agreed = true
# challenge = "http-01"
# http_challenge_listen = "0.0.0.0:80"
# storage_dir = "./acme"

[reliability]
provider_circuit_breaker_failure_threshold = 3
provider_circuit_breaker_cooldown_secs = 30
provider_dispatch_timeout_secs = 10
provider_dispatch_max_retries = 1
provider_response_body_max_bytes = 16777216
graceful_shutdown_grace_period_secs = 3
graceful_shutdown_timeout_secs = 15
# Pingora graceful upgrade uses SIGQUIT and FD transfer through this socket.
graceful_upgrade_pid_file = "/tmp/ferrogate.pid"
graceful_upgrade_sock = "/tmp/ferrogate_upgrade.sock"
graceful_upgrade_sock_retries = 5

# Request-body size caps per gateway surface (#312). Every knob is optional;
# the values shown are the built-in defaults, so omitting the whole section
# (or any knob) leaves behavior unchanged. Each knob must be > 0 and at most
# 1073741824 (1 GiB) -- request bodies are buffered in memory.
# [limits]
# /v1/chat/completions, /v1/embeddings, /v1/images/generations, /v1/messages
# inference_body_max_bytes = 1048576
# Standard /admin/v1 JSON mutations (providers, models, api keys, policies,
# plugins, prompt templates, skill packages, agent workflows/upstreams, MCP
# servers, gateway configs, plans, quota policies, RBAC, virtual keys,
# agent schedules, self-hosted worker management)
# admin_body_max_bytes = 65536
# Compact admin control operations (wallets, site-domain bindings,
# /admin/v1/drain, tool-approval decisions)
# admin_small_body_max_bytes = 16384
# Full-config documents for /admin/v1/config/validate and /config/reload
# admin_config_body_max_bytes = 262144
# Data-plane tool/agent invocation payloads (/v1/tools/execute,
# /v1/mcp/tool/execute, /v1/functions/execute, /v1/mcp JSON-RPC,
# /v1/prompts/{id}/render, /v1/agent-runs creation)
# tool_body_max_bytes = 65536
# Asset control-plane JSON (/v1/assets/presign/* upload-intent, commit,
# download-url) -- asset payload bytes are governed by storage quotas instead
# asset_control_body_max_bytes = 65536
# A2A agent ingress bodies on /v1/agents/*
# agent_ingress_body_max_bytes = 131072
# Self-hosted worker transport frames (lease poll/ack, heartbeat,
# checkpoint, artifact, telemetry envelopes)
# worker_transport_body_max_bytes = 1048576
# /admin/v1/guardrail-policies documents (can carry large pattern lists)
# guardrail_policy_body_max_bytes = 1048576

# Standalone admin-console API service (#315): `ferrogate admin-api serve
# --config <this file>` runs a dedicated listener that authenticates admin
# callers (same [[api_keys]]/[storage] credentials and scope semantics as
# the gateway) and reverse-proxies the path-compatible /admin/v1/* and
# /v1/assets/* surfaces to gateway_url -- so the admin console never talks
# to the AI data-plane listener. The values shown are the defaults.
# [admin_api]
# listen = "127.0.0.1:8095"
# gateway_url = "http://127.0.0.1:8080"
# upstream_timeout_millis = 30000
# Reflected on locally generated responses (preflight + auth-gate errors);
# set the gateway's admin.cors_allowed_origin to the same console origin.
# cors_allowed_origin = "https://admin.example.com"
# Optional TLS for this listener (both paths required together):
# tls_cert_path = "./certs/admin-api.crt"
# tls_key_path = "./certs/admin-api.key"

[[extensions]]
id = "tool.echo"
kind = "tool_provider"
source = "builtin"
enabled = false
order = 10

[extensions.permissions]
tools = ["tool.echo"]
network = []
filesystem = false
shell = false

[extensions.config]
timeout_ms = 30000

[[upstreams]]
name = "example-api"
url = "https://httpbin.org"

[[routes]]
name = "example-api"
upstream = "example-api"
path_prefixes = ["/proxy/httpbin"]
strip_prefix = "/proxy/httpbin"

[[routes.request_headers]]
name = "x-ferrogate-route"
value = "example-api"

[[providers]]
name = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[[providers]]
name = "anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"

[[providers]]
name = "gemini"
kind = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta"
api_key_env = "GEMINI_API_KEY"

[[providers]]
name = "grok"
kind = "grok"
base_url = "https://api.x.ai/v1"
api_key_env = "GROK_API_KEY"

# Physical-route capabilities use a closed vocabulary: chat, streaming,
# vision, images, embeddings, tools, structured_output. Declare only features
# this exact provider/model pair supports. Fallback and canary routes declare
# their own values; they do not inherit the primary declaration.
[[models]]
name = "fast-chat"
provider = "openai"
provider_model = "gpt-4o-mini"
capabilities = ["chat", "streaming", "vision", "tools", "structured_output"]
context_window = 128000
input_price_per_1m = 0.15
output_price_per_1m = 0.60

# [[models.fallbacks]]
# provider = "anthropic"
# provider_model = "claude-3-5-haiku-latest"
# capabilities = ["chat", "streaming", "tools", "structured_output"]
# context_window = 200000
# priority = 10
# weight = 1
#
# [models.canary]
# provider = "anthropic"
# provider_model = "claude-3-5-sonnet-latest"
# capabilities = ["chat", "streaming", "vision", "tools"]
# context_window = 200000
# percent = 5

[[models]]
name = "best-reasoning"
provider = "anthropic"
provider_model = "claude-3-5-sonnet-latest"
capabilities = ["chat", "streaming", "tools"]
context_window = 200000

[[models]]
name = "gemini-flash"
provider = "gemini"
provider_model = "gemini-1.5-flash"
capabilities = ["chat", "streaming", "vision"]
context_window = 1000000

# Development-only inline key. Prefer key_env outside local development.
[[api_keys]]
id = "key_dev"
name = "Development key"
key = "dev-secret"
scopes = ["models.read", "tools.read", "tools.execute", "chat.completions", "responses.create", "admin.read"]
allowed_models = ["fast-chat", "best-reasoning", "gemini-flash"]
denied_models = []
allowed_providers = ["openai", "anthropic", "gemini", "mcp:github"]
denied_providers = []
organization_id = "org_demo"
team_id = "team_platform"
project_id = "project_ferrogate"
monthly_token_budget = 1000000
request_limit_per_minute = 60

[[mcp_servers]]
name = "github"
transport = "streamable_http"
url = "http://127.0.0.1:9000/mcp"
auth_type = "headers"
tools_to_execute = ["search"]
tools_to_auto_execute = ["search"]
tool_include = ["search"]
timeout_ms = 3000
health_ping_interval_secs = 10
max_reconnect_attempts = 5
min_reconnect_backoff_secs = 1
max_reconnect_backoff_secs = 30

[[mcp_servers.headers]]
name = "Authorization"
value_env = "GITHUB_MCP_TOKEN"

# MCP policy targets use model "mcp_tool:<server>-<tool>" and provider
# "mcp:<server>".
[[policies]]
name = "deny blocked MCP search"
effect = "deny"
enabled = false
api_key_ids = []
models = ["mcp_tool:github-search"]
providers = ["mcp:github"]
message = "MCP search is blocked for this caller"

# Content-safety guardrail (issue #236 worked example). This is a minimal,
# deterministic keyword-deny rule evaluated in-process (no external detector):
#   - stage   = "request"  -> checked on the inbound prompt, before the provider
#                             call ("response" instead scans the model output).
#   - effect  = "deny"      -> a match returns HTTP 403 `guardrail_denied` and
#                             blocks the request ("redact" instead masks the
#                             matched span and lets the request continue).
#   - keywords = [...]       -> case-insensitive substring match; use `regex`
#                             for patterns or `max_input_bytes` for a length cap.
# `id` and `name` are required; everything else has a default. Field names are
# NOT typo-checked by `ferrogate validate`, so copy them exactly (see
# docs/guardrails/investigation-view.md).
[[guardrails]]
id = "no-exfil-keyword"
name = "Block EXFILTRATE keyword"
stage = "request"
effect = "deny"
keywords = ["EXFILTRATE"]

# Optional cluster-safe counters for multi-node deployments.
# Keep the default local counter backend for single-node development.
# [cluster]
# enabled = true
# cluster_id = "prod-us"
# counter_backend = "redis"
# redis_url = "redis://redis:6379/0"
# counter_timeout_millis = 500

# Time-based agent schedule triggers (#246). A control-plane trigger layer:
# when a schedule is due the tick loop enqueues a dispatch into the EXISTING
# self-hosted lease queue (or creates an agent run) and records an idempotent
# fire-history row. Disabled by default -- like the billing outbox sweeper the
# loop is always spawned but no-ops entirely until `enabled = true`, so turning
# it on via `/admin/v1/config/reload` needs no restart. Firing is at-most-once
# per (schedule, slot) with minute-level precision; `tick_interval_secs` only
# bounds how quickly a due schedule is detected. Schedule DEFINITIONS live in
# the `agent_schedules` table (managed programmatically today; admin CRUD is
# tracked as follow-up work under #246).
[scheduler]
enabled = false
# Seconds between due-schedule scans (default 5, well below minute precision).
tick_interval_secs = 5
# Upper bound on catch-up fires processed per schedule per tick after downtime,
# so a long outage can never replay an unbounded backlog (default 1).
max_catchup_fires = 1
# IANA timezone applied to a cron schedule that does not set its own.
default_timezone = "UTC"

# Typed Solana x402 spend policy (#351). Disabled by default: with no
# `[[x402_spend_policies]]` entry every scope resolves to a deny-all policy, so
# an agent can never pay an x402 challenge by accident. A declaration is pinned
# to ONE scope of the `tenant -> project -> workspace -> key -> run` chain; the
# NARROWEST declared scope in a request's chain wins (no field-level merging, so
# a child can never silently widen a parent's cap). Inspect what is in force with
# `GET /admin/v1/x402-spend-policies/effective?tenant_id=...` and dry-run a real
# merchant challenge against it with
# `POST /admin/v1/x402-spend-policies/evaluate` -- both expose decisions and
# revisions only, never signer or secret material.
#
# Keep array-of-tables sections like this one LAST in the file: in TOML every
# following top-level key would otherwise be parsed into the last table.
#
# [[x402_spend_policies]]
# scope_type = "tenant"          # tenant | project | workspace | key | run
# scope_id = "acme"             # surrounding whitespace is trimmed; a padded id
#                                # is the SAME scope, never a second one
#
# [x402_spend_policies.policy]
# enabled = true                 # x402 spending is OFF unless explicitly true
# revision = 7                   # echoed into every decision for audit
# # CAIP-2 network ids. Mainnet must be pinned explicitly together with an
# # explicit mainnet mint -- a wildcard mainnet allow is rejected at load.
# allowed_networks = ["solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1"]
# # Exact payee allowlist (base58). A challenge paying anyone else denies.
# allowed_recipients = ["2wKupLR9q6wXYppw8Gr2NvWxKBUqm4PPJKkQfoxHDBg4"]
# allow_insecure_local_resources = false   # http:// resources: test mode only
#
# # Canonical base58 SPL mint per network. A token SYMBOL such as "USDC" is
# # rejected: a symbol can be minted by anyone.
# [[x402_spend_policies.policy.allowed_assets]]
# network = "solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1"
# mint = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
#
# # Which HTTPS origin + path prefix a payment may unlock. The challenge's own
# # resource must equal the egress URL FerroGate already authorized.
# [[x402_spend_policies.policy.allowed_resources]]
# origin = "https://api.example.com"
# path_prefix = "/paid"
#
# # Caps are internal credits, except the two atomic bounds which act directly
# # on the on-chain amount. Omit a field to leave that dimension uncapped; an
# # explicit 0 is rejected (use `enabled = false` to turn payments off).
# [x402_spend_policies.policy.caps]
# max_credits_per_payment = 1000
# max_credits_per_run = 5000
# max_credits_per_window = 10000
# window_seconds = 3600
# max_atomic_per_payment = 2000000
# min_atomic_per_payment = 10
#
# # Checked-integer bridge from atomic token units to internal credits:
# # credits = round(atomic * numerator / denominator). No floats anywhere on the
# # money path; overflow or an impossible ratio denies instead of coercing to 0.
# # `version` is persisted into every decision so an auditor can tie a charge to
# # the exact rate that produced it.
# [x402_spend_policies.policy.conversion]
# numerator = 1
# denominator = 1000
# rounding = "up"                # "up" never under-counts a spend
# version = "usdc-devnet-v1"
# # Optional freshness bound. An opaque `version` string alone cannot detect
# # staleness -- a rate frozen months ago looks identical to one set today. With
# # a deadline set, a decision made at or after it denies (x402_conversion_expired),
# # and so does one whose caller supplied no clock: an unprovable freshness claim
# # must not authorize a spend. Omit to let the rate never expire on its own.
# expires_at_unix = 1800000000
#
# # Payments above this many credits return ApprovalRequired instead of Allow.
# # Omit for auto-allow up to the hard caps.
# [x402_spend_policies.policy.approval]
# threshold_credits = 500
