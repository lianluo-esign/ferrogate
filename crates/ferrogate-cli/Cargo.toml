[package]
name = "ferrogate-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FerroGate command-line entrypoint."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["ai", "gateway", "llm", "proxy", "rust"]
categories = ["web-programming::http-server", "command-line-utilities"]

[[bin]]
name = "ferrogate"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake2.workspace = true
bytes.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
clap.workspace = true
flate2 = "1"
ed25519-dalek.workspace = true
ferrogate-billing = { path = "../ferrogate-billing" }
ferrogate-auth = { path = "../ferrogate-auth" }
ferrogate-config = { path = "../ferrogate-config" }
ferrogate-core = { path = "../ferrogate-core" }
ferrogate-guardrails = { path = "../ferrogate-guardrails" }
ferrogate-mcp = { path = "../ferrogate-mcp" }
ferrogate-observability = { path = "../ferrogate-observability" }
ferrogate-policy = { path = "../ferrogate-policy" }
ferrogate-providers = { path = "../ferrogate-providers" }
ferrogate-routing = { path = "../ferrogate-routing" }
ferrogate-runtime = { path = "../ferrogate-runtime" }
ferrogate-secrets = { path = "../ferrogate-secrets" }
ferrogate-storage = { path = "../ferrogate-storage" }
futures-util.workspace = true
getrandom.workspace = true
http.workspace = true
hmac.workspace = true
instant-acme.workspace = true
jsonwebtoken.workspace = true
matchit.workspace = true
pingora.workspace = true
redis.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pki-types.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tiktoken-rs.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true

[features]
default = []
