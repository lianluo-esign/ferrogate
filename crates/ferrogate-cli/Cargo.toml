[package]
name = "ferrogate-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FerroGate command-line entrypoint."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["ai", "gateway", "llm", "proxy", "rust"]
categories = ["web-programming::http-server", "command-line-utilities"]

[lib]
name = "ferrogate_cli"
path = "src/lib.rs"

[[bin]]
name = "ferrogate"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
# The `string` feature lets the generic Control Plane API resource command tree
# (#361–#365) be built from runtime `String` group/verb names sourced from the
# `ferrogate-control-plane-client` registry metadata (clap's default builder
# only accepts `&'static str` names).
clap = { workspace = true, features = ["string"] }
# Generates the shell completion scripts emitted by `ferrogate completions
# <shell>` (#365) from the SAME assembled `clap::Command` the binary runs, so
# completions cover the generic `ctl <group> <verb>` resource-family tree.
clap_complete.workspace = true
ed25519-dalek.workspace = true
ferrogate-admin = { path = "../ferrogate-admin" }
ferrogate-billing = { path = "../ferrogate-billing" }
ferrogate-auth-service = { path = "../ferrogate-auth-service" }
ferrogate-config = { path = "../ferrogate-config" }
ferrogate-control-plane-client = { path = "../ferrogate-control-plane-client" }
ferrogate-core = { path = "../ferrogate-core" }
ferrogate-gateway = { path = "../ferrogate-gateway" }
ferrogate-guardrails = { path = "../ferrogate-guardrails" }
ferrogate-providers = { path = "../ferrogate-providers" }
ferrogate-runtime = { path = "../ferrogate-runtime" }
ferrogate-storage = { path = "../ferrogate-storage" }
http.workspace = true
pingora.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
# The `asset_presign_e2e` bucket mock re-derives SigV4 from the AWS
# specification instead of calling the product's signer (#259 gate finding: a
# verifier built from `presign_sigv4_query_bound` agrees with whatever that
# function does). It needs HMAC-SHA256 directly; `sha2` is already a runtime
# dependency above.
hmac.workspace = true
rcgen.workspace = true
tempfile.workspace = true

[features]
default = []
