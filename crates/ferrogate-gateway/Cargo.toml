# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-07-27
# description: Token4AI Cloud, FerroGate AI Gateway -- the gateway data-plane
# subsystems extracted out of ferrogate-cli (issue #553).

[package]
name = "ferrogate-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FerroGate gateway data-plane subsystems."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["ai", "gateway", "llm", "proxy", "rust"]
categories = ["web-programming::http-server"]

[lib]
name = "ferrogate_gateway"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake2.workspace = true
bytes.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
# #553 stage 3b-0: `auth` needs the credential vocabulary (`ApiKey`,
# `AuthServiceConfig`), the authenticator trait, the tenant identity and the
# resolved quota that `AuthContext` carries. All four sit below this crate.
ferrogate-auth = { path = "../ferrogate-auth" }
# The rest arrived with the #553 stage 3b trunk: they are the dependency list
# `ferrogate-cli` carried for `gateway/` and `state*.rs`, which is now here.
ferrogate-admin = { path = "../ferrogate-admin" }
ferrogate-billing = { path = "../ferrogate-billing" }
ferrogate-cloudflare = { path = "../ferrogate-cloudflare" }
ferrogate-config = { path = "../ferrogate-config" }
ferrogate-core = { path = "../ferrogate-core" }
ferrogate-guardrails = { path = "../ferrogate-guardrails" }
ferrogate-mcp = { path = "../ferrogate-mcp" }
ferrogate-observability = { path = "../ferrogate-observability" }
ferrogate-payments = { path = "../ferrogate-payments" }
ferrogate-policy = { path = "../ferrogate-policy" }
ferrogate-providers = { path = "../ferrogate-providers" }
ferrogate-routing = { path = "../ferrogate-routing" }
ferrogate-runtime = { path = "../ferrogate-runtime" }
ferrogate-secrets = { path = "../ferrogate-secrets" }
ferrogate-storage = { path = "../ferrogate-storage" }
ferrogate-sync-bridge = { path = "../ferrogate-sync-bridge" }
flate2 = "1"
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
http.workspace = true
instant-acme.workspace = true
jsonwebtoken.workspace = true
matchit.workspace = true
pingora.workspace = true
redis.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pki-types.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tiktoken-rs.workspace = true
# `io-util` is named explicitly rather than inherited by feature unification
# with ferrogate-cli: `asset_scan`'s clamd client is an AsyncRead/AsyncWrite
# user, and this crate must build on its own.
tokio = { workspace = true, features = ["io-util"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
proptest.workspace = true
# `function_egress`'s SSRF/TLS probes stand up a self-signed local TLS server.
rcgen.workspace = true
tempfile.workspace = true

[features]
default = []
