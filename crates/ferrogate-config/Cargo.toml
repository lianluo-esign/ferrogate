[package]
name = "ferrogate-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Configuration parsing and validation for FerroGate."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
# The moved gateway-config tree (#553 stage 3a) validates header names/values
# and upstream URLs with the same `http` types the data plane uses, and loads
# the TLS certificate/key pair through Pingora's loader so a config that
# validates is one the server can actually bind.
http.workspace = true
# The crates the moved `Config` model and its validation already named while
# they lived in `ferrogate-cli`: config fields are typed as these crates' enums
# (`RoutingStrategy`, `ContentSource`, `PostgresTlsMode`, `ActionDecision`...)
# and several validators pre-flight the very constructor the runtime will call,
# so a config that loads is one the subsystem can be built from. None of them
# depends on `ferrogate-config`, so none of these edges is a cycle.
ferrogate-cloudflare = { path = "../ferrogate-cloudflare" }
ferrogate-core = { path = "../ferrogate-core" }
ferrogate-guardrails = { path = "../ferrogate-guardrails" }
ferrogate-mcp = { path = "../ferrogate-mcp" }
ferrogate-observability = { path = "../ferrogate-observability" }
ferrogate-providers = { path = "../ferrogate-providers" }
ferrogate-runtime = { path = "../ferrogate-runtime" }
ferrogate-secrets = { path = "../ferrogate-secrets" }
ferrogate-storage = { path = "../ferrogate-storage" }
# The inbound (#356) monetization model: this crate owns only the operator
# document and the secret-by-reference indirection, and pre-flights the billing
# crate's own constructors, so config validity cannot drift from what the
# runtime enforces. `ferrogate-billing` does not depend on this crate, so the
# edge is not a cycle.
ferrogate-billing = { path = "../ferrogate-billing" }
# Reuse the frozen #351 policy model (types + `validate()` + structured
# `X402PolicyConfigError`) instead of re-implementing it here; this crate only
# owns the operator-facing config surface and parse/validate wiring.
ferrogate-policy = { path = "../ferrogate-policy" }
pingora.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
# The canonical FerroGate structured-config format. The runtime already parses
# TOML for its top-level config; the x402 section loader parses the same format.
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
