# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-06-11
# description: Token4AI Cloud, FerroGate AI Gateway, Rust API Gateway, agent-native AI traffic infrastructure.

[package]
# Named for the service it is, not for the word "auth": the gateway's request
# authenticator is `ferrogate_gateway::auth`, and while this crate was called
# `ferrogate-auth` the two were one word apart in every import and doc link
# (#553 stage 4). This crate is the standalone identity SERVICE -- SSO/SAML/
# SCIM, the admin-console session API, RBAC membership roles -- and the gateway
# talks to it over HTTP, not by linking it.
name = "ferrogate-auth-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Standalone FerroGate identity service: SSO/SAML/SCIM, admin-console sessions, membership roles, and virtual API key/tenant resolution boundaries."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
blake2.workspace = true
clap.workspace = true
ferrogate-core = { path = "../ferrogate-core" }
ferrogate-secrets = { path = "../ferrogate-secrets" }
ferrogate-storage = { path = "../ferrogate-storage" }
flate2.workspace = true
jsonwebtoken.workspace = true
quick-xml.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }
ring.workspace = true
rustls = { workspace = true, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tokio.workspace = true
x509-parser.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
# Deliberately NOT renamed with the package. `ferrogate-auth` is a deployment
# artifact name: it is the file the Dockerfile installs into
# /usr/local/bin/ferrogate-auth, what scripts/build-image-crane.sh packs, and
# what scripts/release-local.sh passes as --ferrogate-auth-bin. Renaming the
# package fixes the Rust-namespace collision with `ferrogate_gateway::auth`;
# renaming the binary would change a shipped interface for nothing, and #553
# stage 4 is a rename-only slice.
name = "ferrogate-auth"
path = "src/main.rs"

[features]
default = []
