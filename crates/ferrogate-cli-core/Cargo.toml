[package]
name = "ferrogate-cli-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Reusable foundation for the FerroGate Control Plane API command-line client: contexts, auth, transport, output, and errors."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
clap = { workspace = true }
# OS CSPRNG for minting the per-invocation `action_id` (issue #548). A
# predictable action id is worse than an absent one — it can be claimed by
# someone else's log line — so the id comes from the OS random source and a
# failure to read it fails the command.
getrandom = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Reproduces the runtime `canonical_target_sha256` action-fingerprint contract
# (issue #505) inside the receipt module. `ferrogate-runtime` itself is NOT a
# dependency here on purpose: it pulls in storage, TLS and a tokio runtime,
# which is the wrong weight for a client library. Byte-equality with
# `CanonicalCapabilityTarget::fingerprint` is proven by a test in
# `ferrogate-cli` (which depends on both crates) instead of assumed.
sha2 = { workspace = true }

[features]
default = []
