[package]
name = "ferrogate-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Storage repository boundaries for FerroGate."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
croner.workspace = true
deadpool-postgres.workspace = true
ferrogate-billing = { path = "../ferrogate-billing" }
ferrogate-cloudflare = { path = "../ferrogate-cloudflare" }
ferrogate-core = { path = "../ferrogate-core" }
# #352: the x402 payment-attempt state alphabet lives in `ferrogate-payments`
# ("state/transition types only; no SQL"). Acyclic -- `ferrogate-payments`
# declares no FerroGate dependency of its own.
ferrogate-payments = { path = "../ferrogate-payments" }
native-tls.workspace = true
postgres-native-tls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true

[dev-dependencies]
ferrogate-core = { path = "../ferrogate-core" }
proptest.workspace = true
tempfile.workspace = true

[features]
default = []
# Test-only fault injection for the durable control-plane write path (#605).
# The in-memory control plane cannot fail `replace_control_plane`, so the branch
# that reports a reload as `committed: false` because persistence failed is
# otherwise unreachable outside a live Postgres/D1 deployment. Never enabled in
# a production build.
fault-injection = []
