[package]
name = "ferrogate-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pingora runtime boundary for FerroGate."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
base64.workspace = true
blake2.workspace = true
chacha20poly1305.workspace = true
ferrogate-core = { path = "../ferrogate-core" }
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
# Control-plane client-certificate issuance for self-hosted workers (issue #249):
# mint the SPIFFE-4-tuple leaf cert signed by the configured issuing CA at worker
# registration. Promoted from a dev-dep now that cert minting runs in non-test
# code. `pem` is enabled so issued material can be handed to the worker as PEM.
rcgen = { workspace = true, features = ["pem", "ring", "x509-parser"] }
# Convert unix-second validity bounds into X.509 notBefore/notAfter (issue #249).
time.workspace = true
# Verified mutual-TLS transport for self-hosted workers (issue #243). rustls
# terminates the handshake and validates the client-cert chain against a single
# configured anchor; the `ring` provider is selected explicitly so no ambient
# process-default crypto provider is relied upon.
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
x509-parser.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
