# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-07-27
# description: Token4AI Cloud, FerroGate AI Gateway -- the async-to-sync
# bridge lifted out of ferrogate-cli's gateway module (issue #553).

[package]
name = "ferrogate-sync-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Async-to-sync bridging for FerroGate's synchronous call paths."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"

[lib]
name = "ferrogate_sync_bridge"
path = "src/lib.rs"

[dependencies]
# The only dependency, and the reason this is a crate of its own rather than a
# module of `ferrogate-core`: `block_in_place` is a `rt-multi-thread` item, so
# any crate hosting this function acquires a tokio dependency, and
# `ferrogate-core` is depended on by four crates (`ferrogate-billing`,
# `ferrogate-policy`, `ferrogate-providers`, `ferrogate-routing`) that have no
# async runtime at all.
tokio.workspace = true

[features]
default = []
