[package]
# Renamed from `ferrogate-cli-core` (#553 rework). The old name asserted a
# containment relation that was false in both directions: at `4c2ba43`, an
# ancestor of the commit that writes this line, the crate is 20,961 `.rs` lines
# against `crates/ferrogate-cli/src`'s 6,200 -- 3.38x -- so it was not the
# "core" of anything it was named after, and "core" said nothing about what is
# inside. The measurement names a commit rather than saying "this tree": the
# figures that stood here were three rounds of review stale, each time because
# the tree moved under a claim written as if it could not. Reproduce at that
# commit rather than in the working tree, which is a different number:
#   git ls-tree -r --name-only 4c2ba43 -- crates/<dir> | grep '\.rs$' \
#     | xargs -I{} git show 4c2ba43:{} | wc -l
# The previously published `git ls-files 'crates/<dir>/*.rs' | xargs cat
# | wc -l` reads whatever is checked out, so it returned 20,965 at `801b449`
# against the 20,961 this line claims -- a ref-pinned figure beside a command
# that ignores the ref is how these numbers went stale in the first place. The
# new
# name is an assertion that can be checked: every request this crate builds
# targets the Control Plane API (`/admin/v1/...`), and `src/parity.rs` puts
# the data plane -- inference, MCP/tool execution, agent invoke/messaging --
# structurally OUTSIDE the surface it is allowed to cover (#390). It is a
# client and only a client: it binds no listener and the dependency list below
# has no `ferrogate-*` entry at all. See `src/lib.rs` for why the fold this
# rename replaces was refused.
name = "ferrogate-control-plane-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Typed client library for the FerroGate Control Plane API: contexts, auth, transport, receipts, output, errors, and the resource command registry the `ferrogate` CLI composes."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
clap = { workspace = true }
# OS CSPRNG for minting the per-invocation `action_id` (issue #548). A
# predictable action id is worse than an absent one — it can be claimed by
# someone else's log line — so the id comes from the OS random source and a
# failure to read it fails the command.
getrandom = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Reproduces the runtime `canonical_target_sha256` action-fingerprint contract
# (issue #505) inside the receipt module. `ferrogate-runtime` itself is NOT a
# dependency here on purpose: it pulls in `ferrogate-storage`, a tokio runtime
# and a rustls crypto provider, which is the wrong weight for a client
# library. (rustls itself IS already in this build, via the workspace
# `reqwest` pin's `rustls-no-provider` -- see `src/lib.rs`.) Byte-equality with
# `CanonicalCapabilityTarget::fingerprint` is proven by a test in
# `ferrogate-cli` (which depends on both crates) instead of assumed.
sha2 = { workspace = true }

[features]
default = []
