[advisories]
# RUSTSEC-2024-0437 is pulled in through pingora-core 0.8 -> prometheus 0.13 -> protobuf 2.x.
# The vulnerable protobuf parser is not used by Ferrogate's request path; Pingora uses prometheus
# for metrics exposition. Remove this ignore once Pingora can use prometheus 0.14+ or another
# metrics path that no longer pulls protobuf 2.x.
ignore = ["RUSTSEC-2024-0437"]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[output]
deny = []
format = "terminal"
quiet = false
show_tree = true

[target]
arch = ["x86_64", "aarch64"]
os = ["linux"]
