# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-06-11
# description: Token4AI Cloud, FerroGate AI Gateway, Rust API Gateway, agent-native AI traffic infrastructure.

[advisories]
# RUSTSEC-2024-0437 is pulled in through pingora-core 0.8 -> prometheus 0.13 -> protobuf 2.x.
# The vulnerable protobuf parser is not used by Ferrogate's request path; Pingora uses prometheus
# for metrics exposition. Remove this ignore once Pingora can use prometheus 0.14+ or another
# metrics path that no longer pulls protobuf 2.x.
#
# The rustls-webpki 0.102.8 advisories below are pulled in through
# libsql 0.10.0-pre.4 -> hyper-rustls 0.25 -> rustls 0.22. FerroGate keeps
# libsql's `tls` feature enabled because remote Turso/libSQL storage depends
# on it. Remove these ignores when libsql publishes a remote TLS stack based
# on rustls-webpki >=0.103.13.
ignore = [
    "RUSTSEC-2024-0437",
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[output]
deny = []
format = "terminal"
quiet = false
show_tree = true

[target]
arch = ["x86_64", "aarch64"]
os = ["linux"]
