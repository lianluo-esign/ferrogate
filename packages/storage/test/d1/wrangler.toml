# Test fixture only — `@ferrogate/storage` is a library and ships no Worker.
#
# It exists for ONE reason: `vitest.d1.config.ts` and `vitest.d1do.config.ts`
# run the SAME suite against two backends, and the second needs a real
# `TENANT_DATA` Durable Object namespace. A DO namespace can only be created
# from a `class_name` resolved against an entry module, which a bare
# `miniflare: { d1Databases: [...] }` config has no place for — hence this file
# plus `entry.ts`, and hence `d1Databases`/`r2Buckets`/the migration bindings
# staying in the vitest configs, where the migration ARRAYS (JS objects read by
# `readD1Migrations`) can be passed at all.
#
# THE PRODUCTION STANZA IS `apps/gateway/wrangler.toml` (tag `v4`). This file
# proves nothing about it: a harness toml is a different file, and renaming
# `TENANT_DATA` there while leaving this alone would leave both suites green.
#
# `new_sqlite_classes`, never `new_classes`: the latter deploys cleanly and
# silently swaps in the key-value backend, at which point `ctx.storage.sql`
# does not exist and every facade test fails for a reason that looks like a
# code bug. It is IMMUTABLE once a namespace exists (`storage_type_mismatch`),
# so the harness mirrors the production choice rather than picking its own.
name = "ferrogate-storage-d1-test"
main = "entry.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "TENANT_DATA"
class_name = "TenantDataObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantDataObject"]
