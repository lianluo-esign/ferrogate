apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrogate-redis
  namespace: ferrogate
  labels:
    app.kubernetes.io/name: ferrogate-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrogate-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrogate-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ferrogate-redis
  namespace: ferrogate
  labels:
    app.kubernetes.io/name: ferrogate-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: ferrogate-redis
