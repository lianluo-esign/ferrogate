# description: Token4AI Cloud, FerroGate AI Gateway, Rust API Gateway, agent-native AI traffic infrastructure.

sources:
  ferrogate_otlp:
    type: opentelemetry
    grpc:
      address: 0.0.0.0:4317
    http:
      address: 0.0.0.0:4318

  ferrogate_prometheus:
    type: prometheus_scrape
    endpoints:
      - http://ferrogate:8080/metrics
    scrape_interval_secs: 15

sinks:
  console:
    type: console
    inputs:
      - ferrogate_otlp.logs
      - ferrogate_otlp.metrics
      - ferrogate_otlp.traces
      - ferrogate_prometheus
    encoding:
      codec: json
