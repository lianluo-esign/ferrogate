# YAML equivalent of the FerroGate TOML observability settings. Translate these
# keys into the same config shape when using YAML-backed deployment tooling.
telemetry:
  service_name: ferrogate

observability:
  enabled: true
  provider: vector
  otlp_endpoint: http://vector:4318
  prometheus_metrics_path: /metrics
  export_timeout_secs: 3
