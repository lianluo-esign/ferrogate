# description: Cloudflare Workers gate — typecheck + workerd E2E for workers/**.

name: Workers

# Why this workflow triggers on push/pull_request while the Rust modules are
# `workflow_call`-only (issue #499):
#
# `ci.yml` runs on `release: published`, deliberately, so day-to-day work does
# not spend cloud runner-minutes. That policy is right for the Rust suites,
# which are minutes each and reproducible locally. It is wrong for this gate:
# #475 landed a Worker with a lost `/**` comment opener, `agent-gateway` was
# undeployable on `main` for as long as it took a human to notice, and a
# release-only gate would have reported it after the fact.
#
# The cost asymmetry makes the exception cheap: this job is `npm ci` + `tsc
# --noEmit` (+ workerd vitest for the Workers that opt in), on a path filter
# that fires only when `workers/**` or the gate itself changes. It cannot run
# for a Rust-only commit.
on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - "workers/**"
      - "scripts/check-workers.sh"
      - "scripts/test-check-workers.sh"
      - "scripts/node-env.sh"
      - ".github/workflows/workers.yml"
  pull_request:
    paths:
      - "workers/**"
      - "scripts/check-workers.sh"
      - "scripts/test-check-workers.sh"
      - "scripts/node-env.sh"
      - ".github/workflows/workers.yml"

permissions:
  contents: read

concurrency:
  group: workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers:
    name: workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The contract test holds discovery, trigger, usable-tree, and explicit
      # workerd opt-in behavior without running npm or workerd.
      - name: Test workers gate contract
        run: ./scripts/test-check-workers.sh

      # The script owns the per-Worker logic: it locates Node and refuses
      # loudly when it cannot (#508), installs dependencies, runs
      # `tsc --noEmit` for every Worker, and boots the explicitly pinned set in
      # workerd via @cloudflare/vitest-pool-workers. The script requires that set
      # to equal the committed vitest.config.ts files, so deleting a config is
      # red, not a silent skip. No Docker or live Cloudflare account is used.
      - name: Run workers gate
        # This lane is Node/npm-only by contract (AGENTS.md "CI Workflow
        # Structure"), so it has no `target/debug/ferrogate` and must not build
        # one. workers/ferrogate-poc's suite proxies to that real binary (#424),
        # so its origin-backed slice is withheld here and the gate says so out
        # loud rather than narrowing itself silently. Everything else --
        # including ferrogate-poc's typecheck and its #484 entrypoint guards --
        # still runs. The full PoC slice is proven in the local release mirror
        # (scripts/release-local.sh), which builds the binary first.
        env:
          WORKERS_SKIP_POC_ORIGIN: "1"
        run: ./scripts/check-workers.sh
