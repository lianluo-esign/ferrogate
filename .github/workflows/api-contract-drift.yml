# description: OpenAPI -> generated-client drift gate, on the commits that can cause it.

name: API contract drift

# The Rust side of the contract has been gated in CI since #392
# (`scripts/check-openapi.py` in rust-quality). Its client-side mirror,
# `admin-console/scripts/check-api-types-drift.mjs`, ran only inside
# `scripts/check-admin-console.sh` -- which no workflow invokes, and which
# until #508 could not even find Node on the dev box. That asymmetry is not
# theoretical: it bounced #488 and #518 in review, and both bounces were the
# same commit shape -- a Rust slice edited the spec and never regenerated the
# TypeScript client.
#
# A stale client still type-checks, so nothing downstream notices; the drift
# surfaces later as a reviewer reproducing it by hand. Gating it here catches
# it on the commit that causes it, which is the only cheap moment.
#
# Path-filtered to the contract, generated artifacts, SDK package metadata and
# the shared generator/checker, so a stale or unpackageable SDK is reported on
# the change that caused it.
on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - "docs/openapi/admin-api.openapi.json"
      - "admin-console/src/lib/api-types.generated.ts"
      - "admin-console/scripts/check-api-types-drift.mjs"
      - "sdks/**"
      - "tools/generated-clients/**"
      - "tools/sdk-packaging/**"
      - "package.json"
      - ".github/workflows/api-contract-drift.yml"
  pull_request:
    paths:
      - "docs/openapi/admin-api.openapi.json"
      - "admin-console/src/lib/api-types.generated.ts"
      - "admin-console/scripts/check-api-types-drift.mjs"
      - "sdks/**"
      - "tools/generated-clients/**"
      - "tools/sdk-packaging/**"
      - "package.json"
      - ".github/workflows/api-contract-drift.yml"

permissions:
  contents: read

concurrency:
  group: api-contract-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: api-contract-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The guard replays `generate:api` (openapi-typescript + the stamp
      # banner) into a temp file and diffs it against the committed client, so
      # it needs the generator itself installed. It never writes to the
      # committed file.
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install Python build frontend
        run: |
          python3 -m venv "$RUNNER_TEMP/ferrogate-sdk-build"
          "$RUNNER_TEMP/ferrogate-sdk-build/bin/python" -m pip install --disable-pip-version-check build

      - name: Check generated clients, SDK runtime contracts and package artifacts
        run: |
          node tools/generated-clients/check.mjs
          bun x vitest run tools/generated-clients/test
          python3 -m unittest discover -s sdks/python
          PYTHON="$RUNNER_TEMP/ferrogate-sdk-build/bin/python" bun run check:sdk-packages
