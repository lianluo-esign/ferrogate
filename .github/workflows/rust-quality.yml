name: Rust quality

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  quality:
    name: rust-quality
    runs-on: [self-hosted, archlinux]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check locked metadata
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Validate OpenAPI schemas
        run: python3 scripts/check-openapi.py

      - name: Validate Kubernetes examples
        run: scripts/check-kubernetes-examples.sh
