name: Rust quality

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  quality:
    name: rust-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Install supply-chain security tools
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked

      - name: Run security check (strict)
        env:
          FERROGATE_SECURITY_REQUIRE_TOOLS: "1"
        run: ./scripts/security-check.sh

      - name: Test image supply-chain verifier policy
        run: |
          ./scripts/test-verify-image-supply-chain.sh
          ./scripts/release-dryrun/run-matrix.sh
          ./scripts/test-perf-gateway-report.sh
          ./scripts/test-check-secret-scan.sh
          python3 -m unittest scripts/test_audit_exceptions.py scripts/test_pingora_vendor.py scripts/test_protobuf_advisory.py scripts/test_workflow_action_pins.py

      # #508: the admin-console gate must fail loudly and by name when the Node
      # toolchain is unreachable, never silently skip. Runs against stub
      # binaries in a scrubbed PATH; no npm/vitest/build work is triggered.
      - name: Test admin-console gate toolchain contract
        run: ./scripts/test-check-admin-console.sh

      # #499: hold manifest discovery, per-commit triggers, stale dependency
      # repair, and the exact workerd/Vitest opt-in set with hermetic stubs.
      - name: Test workers gate contract
        run: ./scripts/test-check-workers.sh

      # These named `-p ferrogate-cli` until #561's rework, and had selected
      # ZERO tests since #553 stage 1 moved the config module into its own
      # crate: `cargo test <filter>` exits 0 when the filter matches nothing,
      # so the step stayed green while running nothing, and paid the entire
      # ferrogate-cli build to do it. Measured on the pre-change tree, both
      # commands: 0 passed, 0 failed, across all 66 ferrogate-cli targets.
      # Now, against ferrogate-config: 21 and 193 tests respectively.
      - name: Run config validation tests
        run: |
          cargo test -p ferrogate-config --all-features config::tests
          cargo test -p ferrogate-config --all-features config::validation_tests

      # #499 (related): check-module-layout.py enforces the per-file line caps
      # that keep ferrogate-storage's lib.rs reviewable. It appeared in no
      # workflow either -- same silent-skip class as the workers gate itself.
      - name: Validate module layout
        run: |
          python3 -m unittest scripts/test_module_layout.py
          python3 scripts/check-module-layout.py

      # #561: the reason a 136k-line crate ran nowhere for its whole life is
      # that nothing was watching for it. This fails when a workspace member is
      # selected by no `cargo test` in the workflows ci.yml reaches, or by none
      # in scripts/local-test-modules.sh -- the second half matters because the
      # local mirror had drifted from the CI matrices, and that drift is how the
      # gap survived review.
      #
      # #553 rework 2 added the other half: a `cargo test` line that names its
      # crate correctly and then filters every test in it away. That is what the
      # two steps above and governed-decision-conformance.yml were doing after
      # #553 moved files between crates, and the crate-level check could not see
      # it, because the crate WAS named. libtest exits 0 on a filter that matches
      # nothing, so three gates ran zero tests and reported success.
      - name: Validate CI crate coverage
        run: |
          python3 -m unittest scripts/test_ci_crate_coverage.py
          python3 scripts/check-ci-crate-coverage.py

      - name: Validate OpenAPI schemas
        run: |
          PYTHONPATH=scripts python3 -m unittest scripts/test_openapi_contract.py
          python3 scripts/check-openapi.py

      - name: Install Node.js for generated client smoke
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/openapi-client-smoke/package-lock.json

      - name: Compile generated OpenAPI client
        working-directory: tools/openapi-client-smoke
        run: |
          npm ci
          npm run check

      - name: Validate Kubernetes examples
        run: scripts/check-kubernetes-examples.sh
