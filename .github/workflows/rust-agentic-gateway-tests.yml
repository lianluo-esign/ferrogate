name: Rust agentic gateway tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  agentic-gateway-tests:
    name: rust-agentic-gateway-tests / ${{ matrix.slice }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: providers
            package: ferrogate-providers
            args: --all-features
          - slice: mcp
            package: ferrogate-mcp
            args: --all-features
          - slice: runtime
            package: ferrogate-runtime
            args: --all-features
          - slice: agentic_lite
            package: ferrogate-cli
            args: --all-features --test agentic_lite
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Test ${{ matrix.slice }} slice
        run: cargo test -p "${{ matrix.package }}" ${{ matrix.args }}
