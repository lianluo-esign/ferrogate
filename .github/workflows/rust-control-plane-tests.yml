name: Rust control plane tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  control-plane-tests:
    name: rust-control-plane-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Test control plane, auth, storage, billing, and observability crates
        run: cargo test -p ferrogate-admin -p ferrogate-auth -p ferrogate-storage -p ferrogate-billing -p ferrogate-observability --all-features
