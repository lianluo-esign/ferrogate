name: Rust control plane tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  control-plane-tests:
    name: rust-control-plane-tests / ${{ matrix.slice }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: admin
            package: ferrogate-admin
            args: --all-features
          - slice: auth
            package: ferrogate-auth
            args: --all-features
          - slice: storage
            package: ferrogate-storage
            args: --all-features
          - slice: billing
            package: ferrogate-billing
            args: --all-features
          - slice: observability
            package: ferrogate-observability
            args: --all-features
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Test ${{ matrix.slice }} slice
        run: cargo test -p "${{ matrix.package }}" ${{ matrix.args }}
