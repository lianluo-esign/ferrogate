# description: FerroGate API and runtime E2E harness CI module.

name: Rust E2E harness

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  e2e-harness:
    name: rust-e2e-harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Build FerroGate test harness
        run: cargo build -p ferrogate-cli -p ferrogate-auth -p ferrogate-test --locked

      - name: Run FerroGate API E2E harness
        run: ./target/debug/ferrogate-test ci
