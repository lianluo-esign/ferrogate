# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-07-18
# description: OPTIONAL, manually-dispatched Firecracker guest-boot validation (#227).

# This is NOT a required gate. Default GitHub-hosted runners have no /dev/kvm,
# so a real microVM boot cannot run there. Trigger this manually on a
# self-hosted, KVM-enabled runner (label `kvm`) that has a firecracker binary +
# guest kernel/rootfs images staged and the AGENT_WORKER_FIRECRACKER_* env
# configured. On any runner lacking KVM/images the gated test skips cleanly, so
# the job stays green (but proves nothing) — see
# docs/sandbox/firecracker-boot-validation.md for the one-command manual path.

name: Firecracker boot validation (optional, KVM)

on:
  workflow_dispatch:
    inputs:
      firecracker_bin:
        description: Path to the firecracker binary on the runner
        required: false
        default: /usr/local/bin/firecracker
      firecracker_jailer:
        description: Path to the jailer binary on the runner
        required: false
        default: /usr/local/bin/jailer
      firecracker_kernel:
        description: Path to the guest kernel (vmlinux) on the runner
        required: false
        default: /srv/firecracker/vmlinux
      firecracker_rootfs:
        description: Path to the ext4 rootfs image on the runner
        required: false
        default: /srv/firecracker/rootfs.ext4

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  firecracker-boot-validation:
    name: firecracker-boot-validation (self-hosted KVM)
    # Requires a self-hosted runner with /dev/kvm; labels are advisory.
    runs-on: [self-hosted, linux, kvm]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Run KVM-gated Firecracker boot validation (#227)
        env:
          AGENT_WORKER_FIRECRACKER_BIN: ${{ inputs.firecracker_bin }}
          AGENT_WORKER_FIRECRACKER_JAILER: ${{ inputs.firecracker_jailer }}
          AGENT_WORKER_FIRECRACKER_KERNEL: ${{ inputs.firecracker_kernel }}
          AGENT_WORKER_FIRECRACKER_ROOTFS: ${{ inputs.firecracker_rootfs }}
        run: |
          cargo test -p agent-worker --test firecracker_boot_validation -- --nocapture
