name: Rust AI proxy tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  ai-proxy-tests:
    name: rust-ai-proxy-tests / ${{ matrix.slice }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: ai_proxy_auth
            package: ferrogate-cli
            args: --all-features --test ai_proxy_auth
          - slice: ai_proxy_dispatch_errors
            package: ferrogate-cli
            args: --all-features --test ai_proxy_dispatch_errors
          - slice: ai_proxy_runtime
            package: ferrogate-cli
            args: --all-features --test ai_proxy_runtime
          - slice: proxy_runtime
            package: ferrogate-cli
            args: --all-features --test proxy_runtime
          - slice: upstream_pool
            package: ferrogate-cli
            args: --all-features --test upstream_pool
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Test ${{ matrix.slice }} slice
        run: cargo test -p "${{ matrix.package }}" ${{ matrix.args }}
