name: Rust AI proxy tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  ai-proxy-tests:
    name: rust-ai-proxy-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Test AI proxy auth, dispatch, and runtime slices
        run: cargo test -p ferrogate-cli --all-features --test ai_proxy_auth --test ai_proxy_dispatch_errors --test ai_proxy_runtime

      - name: Test upstream proxy runtime and pool slices
        run: cargo test -p ferrogate-cli --all-features --test proxy_runtime --test upstream_pool
