name: Rust CLI tooling tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  cli-tooling-tests:
    name: rust-cli-tooling-tests / ${{ matrix.slice }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: cli_bins
            package: ferrogate-cli
            args: --all-features --bins
          - slice: cli_slices
            package: ferrogate-cli
            args: --all-features --test check_command --test workspace_skeleton
          # The Control Plane CLI end-to-end suites. `cargo test -p
          # ferrogate-cli` is never run unfiltered anywhere in CI, so before
          # this slice existed these two targets — the ONLY proof that table/
          # JSON output, error envelopes, exit classes 3/4/5/6/7, timeout, TLS
          # failure, request-id propagation and the whole list/pagination
          # surface behave (#360), and the only lifecycle proof against a live
          # in-process gateway (#362) — compiled but never executed. A
          # regression across the entire list surface would have shipped green.
          - slice: cli_e2e
            package: ferrogate-cli
            args: >-
              --all-features --test control_cli_e2e --test control_cli_resource_e2e
              --test ctl_lifecycle_e2e
          # Renamed from `cli_core` with the crate (#553). The slice label is
          # the visible check name, so it was checked against branch
          # protection before moving: `main`'s required contexts are exactly
          # `["rust-ci"]`, the aggregating job, not the per-slice names — so
          # renaming a slice cannot leave a required check permanently
          # pending. (This is why stage 4 could leave `slice: auth` alone and
          # still be right: that label did not name a crate that had ceased
          # to exist.)
          - slice: control_plane_client
            package: ferrogate-control-plane-client
            args: --all-features
          - slice: test_harness
            package: ferrogate-test
            args: --all-features
          # The whole crate, no filter. #561 measured that 50 of
          # ferrogate-cli's 63 integration targets were selected by nothing and
          # deliberately did NOT add this slice, because the unfiltered run was
          # red on arrival (352 passed, 13 failed across 8 targets) and a job
          # that is red the day it lands gets switched off by the next person.
          # #564 fixed all 13, so that reason has expired: 66 targets, 365
          # passed, 0 failed, 0 ignored, 0 filtered out.
          #
          # It is deliberately kept BESIDE the four filtered slices rather than
          # replacing them. They are the fast, independently-failing signals --
          # `cli_e2e` red tells you which surface broke without reading a
          # 66-target log -- and matrix legs run in parallel, so the cost is
          # one more concurrent runner, not more wall clock on the critical
          # path. That cost is real and is the slowest leg of this workflow:
          # 134s of test time across the 65 binaries, of which
          # `target_capability_e2e` alone is 71s and `asset_presign_e2e` 21s,
          # on top of a full ferrogate-cli build. If it ever needs trimming,
          # those two targets are where the time is, not the long tail.
          - slice: cli_all
            package: ferrogate-cli
            args: --all-features
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Test ${{ matrix.slice }} slice
        run: cargo test -p "${{ matrix.package }}" ${{ matrix.args }}
