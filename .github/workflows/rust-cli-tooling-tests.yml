name: Rust CLI tooling tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  cli-tooling-tests:
    name: rust-cli-tooling-tests / ${{ matrix.slice }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: cli_bins
            package: ferrogate-cli
            args: --all-features --bins
          - slice: cli_slices
            package: ferrogate-cli
            args: --all-features --test check_command --test workspace_skeleton
          - slice: test_harness
            package: ferrogate-test
            args: --all-features
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Test ${{ matrix.slice }} slice
        run: cargo test -p "${{ matrix.package }}" ${{ matrix.args }}
