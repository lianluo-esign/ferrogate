# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-07-27
# description: FerroGate gateway trunk, agent worker, and secret/payment/edge
# crate test CI (issue #561).

# The crates this workflow runs were, until #561, compiled by CI and executed by
# no job at all: ferrogate-gateway (137,062 lines and 1,073 test attributes at
# `8c62886`, the largest crate in
# the workspace, holding auth_test.rs, server/rbac_test.rs, auth_admission_test.rs
# and tenant_scope_reads_fault.rs), agent-worker (342 tests), and the
# secrets/payments/cloudflare/sync-bridge crates. `cargo check` compiled them, so
# they never looked absent.
#
# Every slice below was executed locally before it was written down, and the
# counts in each comment are what that run printed; no slice asserts a green run
# nobody has watched. Review returned that claim once, because it did not hold
# for `agent_worker`: on this box there is no Docker daemon and on
# `ubuntu-latest` there is, and three of that crate's tests branch on a bare
# `docker version` probe. The `docker_bin` matrix key below is what makes the
# claim true again rather than the claim being softened. ONE count was also
# wrong -- `payments`, which recorded a single target's 47 as the whole slice's
# 82. `secrets` moved 50 -> 51 for a different reason entirely: the rework added
# a test. A header whose job is to make the numbers below trustworthy cannot
# file a correction and a change under the same heading, and the first version
# of this paragraph did.
name: Rust platform crate tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  platform-crate-tests:
    name: rust-platform-crate-tests / ${{ matrix.slice }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The whole crate runs unfiltered. At `8c62886` it carries 1,073 test
          # attributes; the previous "1,067 passed" comment predated six tests
          # and was no longer a result for this tree. The four `--skip` filters
          # this slice carried are gone with #563: their shared fixture
          # `signed_snapshot_test_api_key` now declares `organization_id`, so the
          # `Config::validate()` refusal #540 added no longer fires on it and the
          # whole crate runs unfiltered.
          - slice: gateway
            package: ferrogate-gateway
            args: --all-features
          # 342 passed / 0 failed / 0 ignored, 2.6s. Its only previous mention
          # anywhere was `--test firecracker_boot_validation` inside
          # firecracker-boot-validation.yml, which is workflow_dispatch-only and
          # needs a KVM runner -- so it was not CI coverage, and the other 341
          # tests ran nowhere. The Firecracker integration targets skip cleanly
          # without /dev/kvm and are included here on that basis.
          #
          # `AGENT_WORKER_DOCKER_BIN` is the one slice-level environment
          # setting in this workflow, and it exists because of the claim above
          # it. Three tests in this crate branch on `docker_backend_readiness()`
          # -- a bare `docker version` probe, NOT the
          # `AGENT_WORKER_ENABLE_DOCKER_BACKEND` opt-in, which two of them set
          # themselves. On the box where the 342 was measured there is no
          # daemon, so all three took their hermetic branch; `ubuntu-latest`
          # ships one, so unpinned this slice would instead pull an image, exec
          # and commit a live container, and silently stop running the
          # fail-closed assertion in
          # `provision_fails_closed_when_docker_backend_enabled_but_daemon_unreachable`.
          # Naming
          # a binary that does not exist makes the probe fail deterministically,
          # so the slice runs the branch that was watched. The consequence is
          # disclosed rather than hidden: `agent-worker`'s live-Docker lifecycle
          # is exercised by no CI job, here or anywhere.
          - slice: agent_worker
            package: agent-worker
            args: --all-features
            docker_bin: agent-worker-docker-absent
          # 115 passed / 0 failed / 0 ignored, over 2 targets.
          - slice: cloudflare
            package: ferrogate-cloudflare
            args: --all-features
          # 51 passed / 0 failed / 0 ignored -- 49 of them until #561 fixed the
          # cf:// collision guard's error text, which this slice's first run
          # caught, and 50 until the rework pinned the character class that
          # error's variable name is built from.
          - slice: secrets
            package: ferrogate-secrets
            args: --all-features
          # 82 passed / 0 failed / 0 ignored, over 3 targets: 14 in the lib,
          # 48 in negative_corpus, 20 in wire_contract. #561 wrote 47 here,
          # which was the lib target's count of the day and not the slice's.
          - slice: payments
            package: ferrogate-payments
            args: --all-features
          # Zero tests today (80 lines). The slice exists so the crate is
          # selected rather than merely compiled: the state #561 is about is
          # indistinguishable, from the outside, from a crate that has no tests
          # yet, and only one of those two is fine.
          - slice: sync_bridge
            package: ferrogate-sync-bridge
            args: --all-features
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      # `matrix.docker_bin` is empty on every slice but `agent_worker`, and
      # `docker_bin()` treats an empty value exactly as an unset one, so this
      # is inert everywhere else.
      - name: Test ${{ matrix.slice }} slice
        env:
          AGENT_WORKER_DOCKER_BIN: ${{ matrix.docker_bin }}
        run: cargo test -p "${{ matrix.package }}" ${{ matrix.args }}
