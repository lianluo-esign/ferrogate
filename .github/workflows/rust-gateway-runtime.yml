# description: FerroGate gateway runtime and performance smoke CI module.

name: Rust gateway runtime

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  gateway-runtime:
    name: rust-gateway-runtime / ${{ matrix.slice }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: runtime_perf
            args: --test runtime_perf -- --nocapture
          - slice: ai_proxy_perf
            args: --test ai_proxy_perf -- --nocapture
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Run ${{ matrix.slice }} smoke test
        run: cargo test -p ferrogate-cli ${{ matrix.args }}
