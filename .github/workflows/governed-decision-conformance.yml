# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-07-25
# description: The #470 governed-decision conformance suite. Runner A (Rust,
#   in-process authority) and Runner B (the gateway-front Worker in workerd) are
#   driven over the SAME committed corpus at tests/fixtures/governed-decisions,
#   and CI fails on divergence -- which is the only thing that makes the corpus a
#   gate rather than documentation.

name: Governed decision conformance

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  runner-a-authority:
    name: governed-decision-conformance / runner-a-authority
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      # Drives the real admission seam (`decide_ai_request`) over every fixture
      # and enforces the error-vocabulary coverage gate: a reproducible governed
      # outcome with no fixture fails here.
      #
      # This selector read `-p ferrogate-cli --bin ferrogate` until #561's
      # rework, and had been running NOTHING since #553 stage 3b moved the
      # governed-decision seam into `ferrogate-gateway`: measured on the
      # pre-change tree it reported "0 passed; 0 filtered out" -- not even a
      # filtered test to filter, because that binary carries no tests at all.
      # Runner B kept running, so #470's whole point (fail CI on divergence
      # between the authority and the Worker shell) had quietly become a
      # one-sided check. Against `ferrogate-gateway`: 18 tests.
      - name: Runner A -- the authority
        run: cargo test -p ferrogate-gateway --all-features governed_decision

  runner-b-worker-shell:
    name: governed-decision-conformance / runner-b-worker-shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/gateway-front
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the shell
        run: npm run typecheck

      # Boots the real Worker in workerd (the runtime `wrangler dev --local`
      # uses) and asserts the §8d directional properties over the same corpus:
      # the shell may abstain or veto, never allow, never author a metered
      # amount, never write a durable row.
      - name: Runner B -- the veto-only Worker shell
        run: npm test
