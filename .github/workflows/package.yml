# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-06-11
# description: Token4AI Cloud, FerroGate AI Gateway, Rust API Gateway, agent-native AI traffic infrastructure.
# Publishes an SBOM, a keyless cosign signature, and a build provenance
# attestation for every released image alongside it (issue #189).

name: Publish FerroGate package

# Package publishing is a release-gate workflow, not a per-commit CI step. It
# triggers only when a GitHub Release is published; tag pushes and manual
# dispatch do not publish packages. Build and test locally first with
# `ferrogate-test`; this workflow only publishes the release image and does
# not itself run tests or depend on ci.yml (see ci.yml for that).
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-ghcr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/ferrogate"
          version="${{ github.event.release.tag_name }}"
          if [[ ! "$version" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::version must match vYYYY.MM.DD, got '${version}'"
            exit 1
          fi
          short_sha="${GITHUB_SHA::12}"

          echo "name=${image}" >>"$GITHUB_OUTPUT"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:${version}"
            echo "${image}:stable"
            echo "${image}:latest"
            echo "${image}:sha-${short_sha}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=FerroGate
            org.opencontainers.image.description=Open-source Rust API Gateway and AI Gateway
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Generate SBOM, sign image, and attest provenance
        uses: ./.github/actions/image-supply-chain
        with:
          image: ${{ steps.image.outputs.name }}
          digest: ${{ steps.build.outputs.digest }}
          sbom-artifact-name: sbom-release-${{ steps.image.outputs.version }}.spdx.json
