# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-06-11
# description: Token4AI Cloud, FerroGate AI Gateway, Rust API Gateway, agent-native AI traffic infrastructure.
# Promotes an already signed, attested, and verified immutable digest to the
# release tags after the release-only rust-ci gate passes (issue #208).

name: Publish FerroGate package

on:
  workflow_call:
    inputs:
      image:
        description: GHCR repository without a tag or digest
        required: true
        type: string
      digest:
        description: Signed and attested sha256 image digest
        required: true
        type: string
      release-tag:
        description: Release tag in vYYYY.MM.DD form
        required: true
        type: string
      source-digest:
        description: Exact 40-character source commit SHA
        required: true
        type: string
      workflow-ref:
        description: Git ref used by the signing ci-image workflow
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish-ghcr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.source-digest }}

      - name: Validate immutable release subject
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          VERSION: ${{ inputs.release-tag }}
          SOURCE_DIGEST: ${{ inputs.source-digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" == "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ferrogate" ]] || {
            echo "::error::unexpected release image repository"
            exit 1
          }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::release digest must be immutable sha256"
            exit 1
          }
          [[ "$VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] || {
            echo "::error::version must match vYYYY.MM.DD"
            exit 1
          }
          [[ "$SOURCE_DIGEST" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source digest must be a full Git commit SHA"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_DIGEST" ]] || {
            echo "::error::checked out source does not match release source digest"
            exit 1
          }

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify immutable digest before release promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/verify-image-supply-chain.sh \
            --mode release \
            --image "${{ inputs.image }}@${{ inputs.digest }}" \
            --workflow-ref "${{ inputs.workflow-ref }}" \
            --source-digest "${{ inputs.source-digest }}"

      - name: Promote verified digest to release tags
        shell: bash
        run: |
          set -euo pipefail
          subject="${{ inputs.image }}@${{ inputs.digest }}"
          docker buildx imagetools create \
            --tag "${{ inputs.image }}:${{ inputs.release-tag }}" \
            --tag "${{ inputs.image }}:stable" \
            --tag "${{ inputs.image }}:latest" \
            "$subject"

      - name: Confirm every release tag resolves to the verified digest
        shell: bash
        run: |
          set -euo pipefail
          for tag in "${{ inputs.release-tag }}" stable latest; do
            observed="$(docker buildx imagetools inspect \
              "${{ inputs.image }}:${tag}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')"
            [[ "$observed" == "${{ inputs.digest }}" ]] || {
              echo "::error::release tag ${tag} resolved to unexpected digest ${observed}"
              exit 1
            }
          done
