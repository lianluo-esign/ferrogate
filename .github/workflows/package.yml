name: Publish FerroGate package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Date-based container version tag, for example v2026.05.05"
        required: true
        default: "v2026.05.05"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-ghcr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/ferrogate"
          version="${{ github.event.inputs.version }}"
          if [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$version" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::version must match vYYYY.MM.DD, got '${version}'"
            exit 1
          fi
          short_sha="${GITHUB_SHA::12}"

          echo "name=${image}" >>"$GITHUB_OUTPUT"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:${version}"
            echo "${image}:stable"
            echo "${image}:latest"
            echo "${image}:sha-${short_sha}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=FerroGate
            org.opencontainers.image.description=Open-source Rust API Gateway and AI Gateway
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
