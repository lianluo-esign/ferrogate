name: Rust Supabase storage tests

on:
  workflow_call:
    secrets:
      supabase_dsn:
        description: Optional live Supabase DSN for the live restart scenario.
        required: false
      supabase_tls_ca_cert:
        description: Optional live Supabase private root CA PEM.
        required: false
      supabase_tls_mode:
        description: "Optional live Supabase TLS mode: require, verify_ca, or verify_full."
        required: false
      token4ai_openai_api_key:
        description: Optional Token4AI OpenAI-compatible provider key for live billing persistence.
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  supabase-storage-tests:
    name: rust-supabase-storage-tests / ${{ matrix.slice }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: local-compatible
            live: false
          - slice: live-supabase
            live: true
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Build FerroGate and test harness
        run: cargo build -p ferrogate-cli -p ferrogate-test --locked

      - name: Run local Supabase-compatible migration and restart scenarios
        if: ${{ matrix.live == false }}
        run: |
          ./target/debug/ferrogate-test supabase-migration
          ./target/debug/ferrogate-test supabase-restart

      - name: Run live Supabase smoke scenario
        if: ${{ matrix.live == true }}
        env:
          FERROGATE_SUPABASE_DSN: ${{ secrets.supabase_dsn }}
          FERROGATE_SUPABASE_TLS_CA_CERT: ${{ secrets.supabase_tls_ca_cert }}
          FERROGATE_SUPABASE_TLS_MODE: ${{ secrets.supabase_tls_mode }}
          FERROGATE_TOKEN4AI_OPENAI_API_KEY: ${{ secrets.token4ai_openai_api_key }}
        run: |
          if [ -z "$FERROGATE_SUPABASE_DSN" ]; then
            echo "FERROGATE_SUPABASE_DSN is not configured; skipping optional live Supabase restart scenario."
            exit 0
          fi

          args=()
          if [ -n "$FERROGATE_SUPABASE_TLS_MODE" ]; then
            args+=(--tls-mode "$FERROGATE_SUPABASE_TLS_MODE")
          fi
          if [ -n "$FERROGATE_SUPABASE_TLS_CA_CERT" ]; then
            printf '%s' "$FERROGATE_SUPABASE_TLS_CA_CERT" > "${RUNNER_TEMP}/supabase-ca.pem"
            args+=(--tls-ca-cert-path "${RUNNER_TEMP}/supabase-ca.pem")
          fi
          ./target/debug/ferrogate-test component-compliance-supabase "${args[@]}"
          ./target/debug/ferrogate-test supabase-live-smoke "${args[@]}"
          if [ -n "$FERROGATE_TOKEN4AI_OPENAI_API_KEY" ]; then
            ./target/debug/ferrogate-test supabase-live-token4ai-provider "${args[@]}"
          else
            echo "FERROGATE_TOKEN4AI_OPENAI_API_KEY is not configured; skipping optional live Token4AI provider billing scenario."
          fi
