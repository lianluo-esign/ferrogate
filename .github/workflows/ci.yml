name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  rust-ci:
    name: rust-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check locked metadata
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Validate OpenAPI schemas
        run: python3 scripts/check-openapi.py

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Run performance smoke tests
        run: cargo test -p ferrogate-cli --test runtime_perf --test ai_proxy_perf -- --nocapture

  image:
    name: ghcr-image
    needs: rust-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/ferrogate"
          short_sha="${GITHUB_SHA::12}"
          {
            echo "tags<<EOF"
            echo "${image}:sha-${GITHUB_SHA}"
            echo "${image}:sha-${short_sha}"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "${image}:pr-${{ github.event.pull_request.number }}"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=FerroGate
            org.opencontainers.image.description=Open-source Rust API Gateway and AI Gateway
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
