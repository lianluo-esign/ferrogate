# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# Created: 2026-06-11
# description: Token4AI Cloud, FerroGate AI Gateway, Rust API Gateway, agent-native AI traffic infrastructure.

name: CI

# CI runs on GitHub-hosted runners (moved off self-hosted archlinux runners,
# which were unreliable/offline — see issue #189). This is a release-gate
# workflow, not a per-commit CI check: it triggers only when a GitHub Release
# is published. Tag pushes, pull requests, branch pushes, and manual dispatch
# do not spend cloud runner-minutes. Day-to-day development stays local:
# compile FerroGate and run `ferrogate-test` directly in the development
# container.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: rust-quality
    uses: ./.github/workflows/rust-quality.yml

  workers:
    name: workers
    uses: ./.github/workflows/workers.yml

  core-policy-tests:
    name: rust-core-policy-tests
    uses: ./.github/workflows/rust-core-policy-tests.yml

  control-plane-tests:
    name: rust-control-plane-tests
    uses: ./.github/workflows/rust-control-plane-tests.yml

  agentic-gateway-tests:
    name: rust-agentic-gateway-tests
    uses: ./.github/workflows/rust-agentic-gateway-tests.yml

  ai-proxy-tests:
    name: rust-ai-proxy-tests
    uses: ./.github/workflows/rust-ai-proxy-tests.yml

  # #470: the authority and the veto-only Worker shell, over one committed
  # corpus. Fails CI on divergence.
  governed-decision-conformance:
    name: governed-decision-conformance
    uses: ./.github/workflows/governed-decision-conformance.yml

  cli-tooling-tests:
    name: rust-cli-tooling-tests
    uses: ./.github/workflows/rust-cli-tooling-tests.yml

  gateway-runtime:
    name: rust-gateway-runtime
    uses: ./.github/workflows/rust-gateway-runtime.yml

  e2e-harness:
    name: rust-e2e-harness
    uses: ./.github/workflows/rust-e2e-harness.yml

  supabase-storage-tests:
    name: rust-supabase-storage-tests
    uses: ./.github/workflows/rust-supabase-storage-tests.yml
    secrets:
      supabase_dsn: ${{ secrets.FERROGATE_SUPABASE_DSN }}
      supabase_tls_ca_cert: ${{ secrets.FERROGATE_SUPABASE_TLS_CA_CERT }}
      supabase_tls_mode: ${{ secrets.FERROGATE_SUPABASE_TLS_MODE }}
      token4ai_openai_api_key: ${{ secrets.FERROGATE_TOKEN4AI_OPENAI_API_KEY }}

  rust-ci:
    name: rust-ci
    runs-on: ubuntu-latest
    needs:
      - quality
      - core-policy-tests
      - control-plane-tests
      - agentic-gateway-tests
      - ai-proxy-tests
      - governed-decision-conformance
      - cli-tooling-tests
      - gateway-runtime
      - e2e-harness
      - supabase-storage-tests
    steps:
      - name: Confirm Rust CI modules passed
        run: echo "rust-ci aggregate passed after feature-module tests, gateway runtime, and e2e harness modules."

  image:
    name: ghcr-image
    needs: rust-ci
    uses: ./.github/workflows/ci-image.yml
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    secrets: inherit

  package:
    name: publish-release-tags
    needs: image
    uses: ./.github/workflows/package.yml
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      release-tag: ${{ github.event.release.tag_name }}
      source-digest: ${{ github.sha }}
      workflow-ref: ${{ github.ref }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
