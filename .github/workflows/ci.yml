# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# description: Token4AI Cloud, FerroGate AI Gateway on Cloudflare Workers, agent-native AI traffic infrastructure.

# CI for the TypeScript / Cloudflare Workers tree.
#
# This replaces the Rust release-gate workflow, which had become a workflow that
# could not run: it called twelve `rust-*.yml` files deleted along with the Rust
# tree, and it only triggered on `release: published` while branch protection
# required its `rust-ci` aggregate job — a status that could therefore never be
# reported, on a workflow that would have failed to resolve if it had been.
#
# The shape is deliberately different. This runs on every push and pull request,
# because the previous arrangement checked nothing between releases, and a tree
# that is not checked between releases is how you accumulate the never-executed
# test this project keeps finding.
#
# The suite runs under `@cloudflare/vitest-pool-workers`, i.e. real workerd,
# offline — no Docker, no live Cloudflare account, no credentials. That is what
# makes it safe to run on every push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the repo's `packageManager` field. Keep the two in step —
          # a floating version here would let a Bun release change resolution
          # without a commit that says so.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Runs every workspace's vitest suite. `vitest-pool-workers` boots real
      # workerd in-process, so this covers the Worker composition roots and the
      # Durable Object classes, not just pure functions.
      - name: Test
        run: bun run test

      # NON-BLOCKING, AND THAT IS A DELIBERATE, TEMPORARY CHOICE.
      #
      # `bun run lint` currently reports ~1954 errors (apps 711, packages 679,
      # admin-console 564) — biome has never been clean on this tree, including
      # on the freshly written TypeScript. Making it blocking today would mean
      # committing a gate that is red on a correct tree, which is exactly the
      # failure mode the Rust `rust-ci` check just demonstrated: a required
      # status nobody can satisfy teaches everyone to bypass the gate.
      #
      # So it reports without failing the build, and the count is written into
      # the job summary so the number is visible and can be driven down. Flip
      # `continue-on-error` to false in the same commit that reaches zero.
      - name: Lint (non-blocking — see comment)
        id: lint
        continue-on-error: true
        run: |
          set +e
          bun run lint 2>&1 | tee /tmp/lint.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Lint"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Clean. **Make this gate blocking** — remove \`continue-on-error\` from the lint step."
            else
              echo "Not clean yet — non-blocking on purpose."
              echo
              echo '```'
              tail -5 /tmp/lint.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
