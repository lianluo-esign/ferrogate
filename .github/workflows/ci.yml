# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# description: Token4AI Cloud, FerroGate AI Gateway on Cloudflare Workers, agent-native AI traffic infrastructure.

# CI for the TypeScript / Cloudflare Workers tree.
#
# RELEASE-GATE ONLY, by owner directive (2026-08-02): this does NOT run on push
# or pull request. Day-to-day verification happens LOCALLY, where the same suite
# runs under `@cloudflare/vitest-pool-workers` (real workerd, offline, no Docker,
# no account, no credentials) in well under a minute per workspace. A hosted
# runner takes six minutes to tell you what a local run already told you, and
# waiting on it is the single largest source of latency in the dev loop.
#
# This is NOT the shape the deleted Rust gate had, even though the trigger
# matches. That one called twelve `rust-*.yml` files that no longer existed and
# was required by branch protection, so it could never report and every push
# bypassed the rule. This one resolves, runs, and is not a required status
# check — it is a last look before a release goes out, not a gate people learn
# to route around.
#
# The property that made per-push CI attractive — that a tree unchecked between
# releases accumulates never-executed tests — is preserved by the local
# discipline instead: every change is expected to run the suites it touches, and
# every PR is audited by an independent agent that re-runs them.

name: CI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the repo's `packageManager` field. Keep the two in step —
          # a floating version here would let a Bun release change resolution
          # without a commit that says so.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Runs every workspace's vitest suite. `vitest-pool-workers` boots real
      # workerd in-process, so this covers the Worker composition roots and the
      # Durable Object classes, not just pure functions.
      - name: Test
        run: bun run test

      # `sdks/python` has no `package.json`, so it is NOT a bun workspace and
      # `bun run test` (which is `bun run --filter '*' test`) cannot reach it.
      # Without this step its suite only runs when a human remembers to type the
      # root script — which is precisely how a hand-written client that mirrors
      # a machine-readable contract turns into a rotting duplicate.
      #
      # A separate step rather than a line inside `test:*` because the failure
      # should read as "the Python SDK broke", not as an opaque workspace error.
      - name: Test (Python SDK)
        run: bun run test:sdk-python

      # NON-BLOCKING, AND THAT IS A DELIBERATE, TEMPORARY CHOICE.
      #
      # `bun run lint` currently reports 2793 errors (apps 1176, packages 965,
      # admin-console 559, tools 45, sdks 5, docs 5) — biome has never been clean
      # on this tree, including on the freshly written TypeScript. The count is
      # measured over TRACKED files only: `biome.json` sets `vcs.useIgnoreFile`,
      # without which biome also walks `.claude/worktrees/**` — other agents'
      # transient checkouts of this same repo — and the number stops being a
      # property of the commit at all (it read 4597 on a machine with three
      # worktrees open, and the extra 1800 pushed real diagnostics past biome's
      # display cap). Making it blocking today would mean
      # committing a gate that is red on a correct tree, which is exactly the
      # failure mode the Rust `rust-ci` check just demonstrated: a required
      # status nobody can satisfy teaches everyone to bypass the gate.
      #
      # "has never been clean" is measured, not asserted. At a9ae3e9e — the
      # merge-base, before the first commit of the branch that carries this
      # comment — `biome check .` reports 2798 errors / 86 warnings over 1609
      # files. At the tip it reports 2793 / 86 over 1617. A slice that ADDS
      # eight files and REMOVES five diagnostics is not the reason this step is
      # red, and any future slice can prove the same thing the same way:
      # `git worktree add --detach /tmp/probe <merge-base>` and run biome there.
      # That is a read-only operation on a scratch directory; it is not a
      # checkout of the working tree.
      #
      # What reaching zero actually costs, measured on that same probe, because
      # "just run --write" is the obvious wrong answer and someone will try it:
      #
      #   * `biome check . --write` (SAFE fixes only) clears 916 of the 2879
      #     diagnostics across 628 files — and it is still wrong to run blind.
      #     organizeImports sorts the import block but leaves leading comments
      #     where they are, so a type-import that sorts to the front lands ABOVE
      #     the file's header docblock (reproduce: packages/storage/src/d1/
      #     monotonic.ts, whose 40-line header ends up under three imports).
      #     In a tree whose headers carry the reasoning, that is a regression the
      #     linter cannot see. The ~389 organizeImports diagnostics need reading.
      #   * `--write --unsafe` gets to 284 errors, and buys it by rewriting all
      #     505 `noNonNullAssertion` sites from `x!.y` to `x?.y` — a semantic
      #     change, on money paths, that biome ITSELF then reports as broken: the
      #     run comes back with 2 NEW `noUnsafeOptionalChaining` errors (e.g.
      #     admin-console/src/pages/site-domains.test.tsx:345, where spreading
      #     the now-optional result would throw), 3 new `noImplicitAnyLet` and
      #     298 `useSemanticElements`. Never run it repo-wide.
      #
      # So the residual is 1891 lint + 513 format + ~389 organizeImports, and it
      # is dominated by three style rules — useLiteralKeys 1193, noNonNullAssertion
      # 505, useTemplate 108 — against a tsconfig with `noUncheckedIndexedAccess`,
      # which is what makes `!` idiomatic here in the first place. Driving that to
      # zero is a repo-wide chore with its own issue, not a rider on whatever
      # slice happens to notice. The remaining ~172 (useExhaustiveDependencies,
      # noArrayIndexKey, noAssignInExpressions, the admin-console a11y set) are
      # the ones worth hand-fixing first: they are the ones that can be bugs.
      #
      # So it reports without failing the build, and the count is written into
      # the job summary so the number is visible and can be driven down. Flip
      # `continue-on-error` to false in the same commit that reaches zero — and
      # only then. A slice that turns rules OFF to make this green has removed
      # the gate, not passed it.
      - name: Lint (non-blocking — see comment)
        id: lint
        continue-on-error: true
        run: |
          set +e
          bun run lint 2>&1 | tee /tmp/lint.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Lint"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Clean. **Make this gate blocking** — remove \`continue-on-error\` from the lint step."
            else
              echo "Not clean yet — non-blocking on purpose."
              echo
              echo '```'
              tail -5 /tmp/lint.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
