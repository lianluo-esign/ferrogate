# Token4AI Cloud Attribution
# Developed by the commercial cloud service company represented by https://token4ai.cloud.
# Author: jamesduan (X: https://x.com/JamesDuanL)
# description: Token4AI Cloud, FerroGate AI Gateway on Cloudflare Workers, agent-native AI traffic infrastructure.

# CI for the TypeScript / Cloudflare Workers tree.
#
# RELEASE-GATE ONLY, by owner directive (2026-08-02): this does NOT run on push
# or pull request. Day-to-day verification happens LOCALLY, where the same suite
# runs under `@cloudflare/vitest-pool-workers` (real workerd, offline, no Docker,
# no account, no credentials) in well under a minute per workspace. A hosted
# runner takes six minutes to tell you what a local run already told you, and
# waiting on it is the single largest source of latency in the dev loop.
#
# This is NOT the shape the deleted Rust gate had, even though the trigger
# matches. That one called twelve `rust-*.yml` files that no longer existed and
# was required by branch protection, so it could never report and every push
# bypassed the rule. This one resolves, runs, and is not a required status
# check — it is a last look before a release goes out, not a gate people learn
# to route around.
#
# The property that made per-push CI attractive — that a tree unchecked between
# releases accumulates never-executed tests — is preserved by the local
# discipline instead: every change is expected to run the suites it touches, and
# every PR is audited by an independent agent that re-runs them.

name: CI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the repo's `packageManager` field. Keep the two in step —
          # a floating version here would let a Bun release change resolution
          # without a commit that says so.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Runs every workspace's vitest suite. `vitest-pool-workers` boots real
      # workerd in-process, so this covers the Worker composition roots and the
      # Durable Object classes, not just pure functions.
      - name: Test
        run: bun run test

      # `sdks/python` has no `package.json`, so it is NOT a bun workspace and
      # `bun run test` (which is `bun run --filter '*' test`) cannot reach it.
      # Without this step its suite only runs when a human remembers to type the
      # root script — which is precisely how a hand-written client that mirrors
      # a machine-readable contract turns into a rotting duplicate.
      #
      # A separate step rather than a line inside `test:*` because the failure
      # should read as "the Python SDK broke", not as an opaque workspace error.
      - name: Test (Python SDK)
        run: bun run test:sdk-python

      # NON-BLOCKING, AND THAT IS A DELIBERATE, TEMPORARY CHOICE.
      #
      # `bun run lint` currently reports 2531 errors / 63 warnings (apps 1050,
      # packages 838, admin-console 559, tools 37, sdks 5, docs 5) — biome has
      # never been clean on this tree, including on the freshly written
      # TypeScript. Making it blocking today would mean committing a gate that is
      # red on a correct tree, which is exactly the failure mode the Rust
      # `rust-ci` check just demonstrated: a required status nobody can satisfy
      # teaches everyone to bypass the gate.
      #
      # HOW TO RE-MEASURE, because an earlier revision of this comment carried
      # numbers nobody could reproduce (it claimed 2793/86 at a tip that measures
      # 2531/63, and named the wrong merge-base sha). Do NOT trust an in-place
      # `biome check .` from a dirty checkout as the number of record. Extract the
      # commit and measure that:
      #
      #     git archive <sha> | tar -x -C /tmp/probe
      #     cd /tmp/probe && <repo>/node_modules/.bin/biome check .
      #
      # `git archive` is read-only, needs no worktree, mutates no git state, and
      # yields TRACKED files only — so the count is a property of the commit
      # rather than of whatever build output happened to be lying around. It
      # agrees with the in-place run precisely because `biome.json` now sets
      # `vcs.useIgnoreFile`, which is what makes `dist/`, `.wrangler/` and
      # `.claude/worktrees/**` (other agents' transient checkouts of this same
      # repo) invisible to the walker. Both read 1623 files at the tip.
      #
      # "has never been clean" is measured, not asserted. At 40f8913f — the
      # merge-base of the branch carrying this comment — the probe reports 2548
      # errors / 63 warnings over 1609 files. At the tip: 2531 / 63 over 1623. A
      # slice that ADDS 14 files and REMOVES 17 errors is not the reason this
      # step is red.
      #
      # Re-measured independently at the tip of this branch by the third attempt
      # at #823, because the two numbers above drifted by one when the last
      # commit landed and a stale count is exactly what this block exists to
      # prevent: the figures were written at c321511c, which really does probe
      # 2532/63, and a414b597 then removed one more error. Anything that changes
      # the tip must re-run the probe rather than copy these forward.
      #
      # What reaching zero actually costs, re-measured on that probe at the tip,
      # because "just run --write" is the obvious wrong answer and someone will
      # try it:
      #
      #   * `biome check . --write` (SAFE fixes only) fixes 617 files and takes
      #     2531 errors to 1629 — and it is still wrong to run blind.
      #     organizeImports sorts the import block but leaves leading comments
      #     where they are, so a type-import that sorts to the front lands ABOVE
      #     the file's header docblock. Reproduced verbatim on
      #     packages/storage/src/d1/monotonic.ts, whose header — the one
      #     explaining why a monotonic upsert is not "just an upsert" — ends up
      #     under three `import type` lines. In a tree whose headers carry the
      #     reasoning, that is a regression the linter cannot see. The 383
      #     organizeImports diagnostics need reading, not applying.
      #   * `--write --unsafe` then fixes 272 more files and reaches 261 errors,
      #     and buys it by rewriting `x!.y` to `x?.y` at ~205 sites
      #     (noNonNullAssertion 402 -> 197). Biome ITSELF reports the result as
      #     worse: warnings go UP 63 -> 77, noAssignInExpressions 33 -> 36, and a
      #     new noUnsafeOptionalChaining lands at
      #     admin-console/src/pages/site-domains.test.tsx:345, where spreading
      #     the now-optional result would throw. Note WHERE those rewrites land:
      #     they cluster in TESTS (apps/control-plane/test/spend-anomaly.test.ts
      #     20, apps/gateway/test/streaming/sse.test.ts 15, ...), not in
      #     packages/storage/src/d1/ — wallet-d1.ts, assets-d1.ts, credits.ts and
      #     metering/d1.ts come back byte-identical. That is not reassuring, it is
      #     the worst case: turning `x!.y` into `x?.y` inside an assertion
      #     converts a test that would FAIL on a missing value into one that
      #     silently passes. Never run it repo-wide.
      #
      # The residual is dominated by four rules — useLiteralKeys 1192, format
      # 511, noNonNullAssertion 402, organizeImports 383, then useTemplate 107 —
      # against a tsconfig with `noUncheckedIndexedAccess`, which is what makes
      # `!` idiomatic here in the first place. Driving that to zero is a repo-wide
      # chore with its own issue, not a rider on whatever slice happens to notice.
      # The small tail (useExhaustiveDependencies 6, noArrayIndexKey 4,
      # noAssignInExpressions 33, the admin-console a11y set) is worth hand-fixing
      # first: those are the ones that can be bugs.
      #
      # What a slice IS expected to do: leave the files it touches clean. Lint the
      # diff, not the repo —
      #   git diff --name-only <base>...HEAD | grep -E '\.(ts|tsx|js|mjs|json)$' \
      #     | xargs node_modules/.bin/biome check
      # — which reports 0 for this branch's 44 changed files.
      #
      # So it reports without failing the build, and the count is written into
      # the job summary so the number is visible and can be driven down. Flip
      # `continue-on-error` to false in the same commit that reaches zero — and
      # only then. A slice that turns rules OFF to make this green has removed
      # the gate, not passed it.
      - name: Lint (non-blocking — see comment)
        id: lint
        continue-on-error: true
        run: |
          set +e
          bun run lint 2>&1 | tee /tmp/lint.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Lint"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Clean. **Make this gate blocking** — remove \`continue-on-error\` from the lint step."
            else
              echo "Not clean yet — non-blocking on purpose."
              echo
              echo '```'
              tail -5 /tmp/lint.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
