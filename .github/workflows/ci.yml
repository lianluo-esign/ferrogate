name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: rust-quality
    uses: ./.github/workflows/rust-quality.yml

  workspace-tests:
    name: rust-workspace-tests
    uses: ./.github/workflows/rust-workspace-tests.yml

  gateway-runtime:
    name: rust-gateway-runtime
    uses: ./.github/workflows/rust-gateway-runtime.yml

  e2e-harness:
    name: rust-e2e-harness
    uses: ./.github/workflows/rust-e2e-harness.yml

  rust-ci:
    name: rust-ci
    runs-on: ubuntu-latest
    needs:
      - quality
      - workspace-tests
      - gateway-runtime
      - e2e-harness
    steps:
      - name: Confirm Rust CI modules passed
        run: echo "rust-ci aggregate passed after quality, workspace, gateway runtime, and e2e harness modules."

  image:
    name: ghcr-image
    needs: rust-ci
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
