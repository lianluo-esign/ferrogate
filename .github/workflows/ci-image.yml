# Created: 2026-06-24
# description: FerroGate CI image build and GHCR publishing module. Publishes
# an SBOM, a keyless cosign signature, and a build provenance attestation for
# every image alongside it (issue #189).

name: CI image

on:
  workflow_call:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    name: ghcr-image
    runs-on: [self-hosted, archlinux]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/ferrogate"
          short_sha="${GITHUB_SHA::12}"
          echo "name=${image}" >>"$GITHUB_OUTPUT"
          echo "short-sha=${short_sha}" >>"$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:sha-${GITHUB_SHA}"
            echo "${image}:sha-${short_sha}"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "${image}:pr-${{ github.event.pull_request.number }}"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish CI image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=FerroGate
            org.opencontainers.image.description=Open-source Rust API Gateway and AI Gateway
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate SBOM, sign image, and attest provenance
        uses: ./.github/actions/image-supply-chain
        with:
          image: ${{ steps.image.outputs.name }}
          digest: ${{ steps.build.outputs.digest }}
          sbom-artifact-name: sbom-ci-image-${{ steps.image.outputs.short-sha }}.spdx.json
