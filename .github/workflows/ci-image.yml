name: CI image

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ghcr-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/ferrogate"
          short_sha="${GITHUB_SHA::12}"
          {
            echo "tags<<EOF"
            echo "${image}:sha-${GITHUB_SHA}"
            echo "${image}:sha-${short_sha}"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "${image}:pr-${{ github.event.pull_request.number }}"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=FerroGate
            org.opencontainers.image.description=Open-source Rust API Gateway and AI Gateway
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
