name: Turso libSQL init smoke

on:
  workflow_dispatch:
    inputs:
      libsql_url:
        description: "Turso/libSQL database URL"
        required: true
        default: "libsql://ferrogate-lianluo-esign.aws-ap-northeast-1.turso.io"

permissions:
  contents: read

concurrency:
  group: turso-libsql-init-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-container:
    name: build-run-container
    runs-on: ubuntu-latest
    env:
      FERROGATE_LIBSQL_AUTH_TOKEN: ${{ secrets.FERROGATE_LIBSQL_AUTH_TOKEN }}
      FERROGATE_LIBSQL_URL: ${{ inputs.libsql_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify libSQL secret is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FERROGATE_LIBSQL_AUTH_TOKEN}" ]]; then
            echo "::error::Repository secret FERROGATE_LIBSQL_AUTH_TOKEN is required"
            exit 1
          fi

      - name: Build local FerroGate image
        run: docker build -t ferrogate:turso-libsql-init .

      - name: Write runtime config
        shell: bash
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/ferrogate.yaml" <<YAML
          listen: "0.0.0.0:8080"

          admin:
            listen: "0.0.0.0:2019"

          storage:
            provider: turso_libsql
            required: true
            provider_order:
              - turso_libsql
              - postgres
              - mysql
            libsql_url: "${FERROGATE_LIBSQL_URL}"
            libsql_auth_token_env: "FERROGATE_LIBSQL_AUTH_TOKEN"
            migration_mode: auto

          api_keys:
            - id: "admin"
              name: "admin"
              key: "admin-secret"
              enabled: true
              scopes:
                - "admin.read"
                - "admin.write"
          YAML

      - name: Run FerroGate container
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f ferrogate-turso-init >/dev/null 2>&1 || true
          docker run -d --name ferrogate-turso-init \
            -p 18089:8080 \
            -p 12019:2019 \
            -e FERROGATE_LIBSQL_AUTH_TOKEN \
            -v "${RUNNER_TEMP}/ferrogate.yaml:/etc/ferrogate/ferrogate.yaml:ro" \
            ferrogate:turso-libsql-init \
            ferrogate run --config /etc/ferrogate/ferrogate.yaml

      - name: Verify durable libSQL storage
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS -H 'Authorization: Bearer admin-secret' \
              http://127.0.0.1:18089/admin/v1/status >"${RUNNER_TEMP}/status.json"; then
              ready=true
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx ferrogate-turso-init; then
              docker logs ferrogate-turso-init --tail 120
              exit 1
            fi
            sleep 2
          done

          if [[ "${ready}" != "true" ]]; then
            docker ps -a --filter name=ferrogate-turso-init
            docker exec ferrogate-turso-init sh -c 'command -v ss >/dev/null && ss -ltnp || true'
            docker logs ferrogate-turso-init --tail 200
            curl -v -H 'Authorization: Bearer admin-secret' \
              http://127.0.0.1:18089/admin/v1/status || true
            echo "::error::FerroGate admin status did not become ready"
            exit 1
          fi

          jq -e '
            .storage.provider == "turso_libsql" and
            .storage.durable == true and
            .storage.implemented == true and
            .storage.required == true
          ' "${RUNNER_TEMP}/status.json" >/dev/null

          jq '{service, auth_required, storage, api_keys}' "${RUNNER_TEMP}/status.json"

      - name: Cleanup container
        if: always()
        run: docker rm -f ferrogate-turso-init >/dev/null 2>&1 || true
