[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ferrogate-admin"
version = "0.1.0"
description = "Thin standard-library Python client for the FerroGate admin API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "FerroGate contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["ferrogate_admin", "ferrogate_admin.*"]
