{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ferrogate.secretName" . }}
  labels:
    {{- include "ferrogate.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
