apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferrogate.fullname" . }}
  labels:
    {{- include "ferrogate.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "ferrogate.selectorLabels" . | nindent 4 }}
