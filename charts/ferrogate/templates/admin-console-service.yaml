{{- if .Values.adminConsole.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferrogate.adminConsoleName" . }}
  labels:
    {{- include "ferrogate.adminConsoleLabels" . | nindent 4 }}
spec:
  type: {{ .Values.adminConsole.service.type }}
  ports:
    - name: http
      port: {{ .Values.adminConsole.service.port }}
      targetPort: http
  selector:
    {{- include "ferrogate.adminConsoleSelectorLabels" . | nindent 4 }}
{{- end }}
