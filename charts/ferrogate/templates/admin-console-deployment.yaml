{{- if .Values.adminConsole.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ferrogate.adminConsoleName" . }}
  labels:
    {{- include "ferrogate.adminConsoleLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.adminConsole.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ferrogate.adminConsoleSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ferrogate.adminConsoleSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: admin-console
          image: "{{ .Values.adminConsole.image.repository }}:{{ .Values.adminConsole.image.tag }}"
          imagePullPolicy: {{ .Values.adminConsole.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # New names: admin/control-plane paths and gateway data-plane paths
            # are separate backend origins.
            - name: CONTROL_PLANE_BASE_URL
              value: {{ default .Values.adminConsole.env.adminApiBaseUrl .Values.adminConsole.env.controlPlaneBaseUrl | quote }}
            - name: GATEWAY_BASE_URL
              value: {{ default .Values.adminConsole.env.gatewayAdminBaseUrl .Values.adminConsole.env.gatewayBaseUrl | quote }}
            # Legacy aliases remain available to older console images.
            - name: AUTH_BASE_URL
              value: {{ .Values.adminConsole.env.authBaseUrl | quote }}
            - name: GATEWAY_ADMIN_BASE_URL
              value: {{ .Values.adminConsole.env.gatewayAdminBaseUrl | quote }}
            {{- with .Values.adminConsole.env.adminApiBaseUrl }}
            # Dedicated admin-console API service (issue #315); takes
            # precedence over GATEWAY_ADMIN_BASE_URL when set.
            - name: ADMIN_API_BASE_URL
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          {{- with .Values.adminConsole.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.adminConsole.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.adminConsole.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.adminConsole.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
